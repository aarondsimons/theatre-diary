<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Aaron's Theatre Diary</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Source+Serif+4:ital,wght@0,400;0,600;0,700;1,400&family=Assistant:wght@400;500;600;700&family=Google+Sans:wght@400;500;600;700&family=Noto+Serif+Hebrew:wght@400;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet.heat@0.2.0/dist/leaflet-heat.js"></script>
<script>
const SHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vR_6YYrB1FXASLMEeovADIFo8akP8G1aNCOl_r12RfCgla-jIWBRWW2Ie7rYpTBr1a2bvEd0FlQXnBj/pub?output=csv";
</script>
 <link rel="icon" type="image/png" href="/favicon-96x96.png" sizes="96x96" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="shortcut icon" href="/favicon.ico" />
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-title" content="🎭 Diary" />
  <link rel="manifest" href="/site.webmanifest" />
<style>
  :root {
    --bg: #faf8f4;
    --panel: #ffffff;
    --panel-2: #f3efe7;
    --ink: #1a1a1a;
    --ink-2: #4a4a4a;
    --ink-3: #8a8578;
    --ink-4: #bab4a4;
    --rule: #e6e0d2;
    --rule-2: #efeadb;
    --accent: #007FFF;
    --accent-soft: #e0f0ff;
    --shadow-sm: 0 1px 2px rgba(60,40,20,0.04), 0 2px 8px rgba(60,40,20,0.04);
    --shadow-md: 0 4px 16px rgba(60,40,20,0.06), 0 12px 32px rgba(60,40,20,0.08);
    --ff-sans: "DM Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    --ff-serif: "Source Serif 4", Georgia, serif;
    --ff-heb: "Google Sans", "Assistant", sans-serif;
    --ff-heb-serif: "Noto Serif Hebrew", serif;
    --pad: 56px;
    --gap: 24px;
    --row-pad: 18px;
    --radius: 10px;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: var(--ff-sans);
    font-size: 15px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }

  .page {
    max-width: 1200px;
    margin: 0 auto;
    padding: 48px var(--pad) 120px;
  }

  /* Header */
  header.hd {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    gap: 24px;
    padding-bottom: 28px;
  }
  .hd-title h1 {
    font-family: var(--ff-serif);
    font-weight: 700;
    font-size: 44px;
    line-height: 1.05;
    letter-spacing: -0.02em;
    margin: 0;
  }
  .hd-title h1 em {
    color: var(--accent);
    font-style: italic;
    font-weight: 400;
  }
  .hd-title .sub {
    color: var(--ink-3);
    font-size: 15px;
    margin-top: 6px;
  }
  .hd-meta {
    display: flex; gap: 28px;
    font-size: 13px;
    color: var(--ink-3);
    margin-bottom: 1px;
  }
  .hd-meta .n { display: block; font-size: 22px; font-weight: 600; color: var(--ink); font-family: var(--ff-serif); margin-bottom: 2px; }
  .live {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 12px; color: var(--ink-3);
  }
  .live-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); animation: pulse 2s infinite; }
  @keyframes pulse { 50% { opacity: 0.4; } }

  /* Section headers */
  .sec-hd {
    display: flex; align-items: baseline; gap: 14px;
    margin: 60px 0 20px;
  }
  #main > .sec-hd:first-child,
  #main > .otd-wrap + .sec-hd {
    margin-top: 20px;
  }
  .sec-hd h2 {
    font-family: var(--ff-serif);
    font-weight: 600;
    font-size: 24px;
    letter-spacing: -0.01em;
    margin: 0;
    white-space: nowrap;
  }
  .sec-hd .sub {
    color: var(--ink-3);
    font-size: 13px;
  }
  .sec-hd .rule { flex: 1; height: 1px; background: var(--rule); margin-bottom: 4px; }
  .sec-hd .sec-hd-toggle { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--ink-3); cursor: pointer; white-space: nowrap; user-select: none; }
  .hide-ratings .vbar-chip,
  .hide-ratings .funnel-meta,
  .hide-ratings .chart-rating { display: none !important; }
  .hide-ratings .pie-legend { flex-direction: row; flex-wrap: wrap; gap: 4px 14px; justify-content: center; }
  .hide-ratings .pie-legend-row { width: auto; }

  /* Stats */
  /* On this day */
  .otd-wrap {
    background: var(--panel); border: 1px solid var(--rule);
    border-radius: var(--radius); padding: 14px 18px;
    margin-bottom: var(--gap);
    display: flex; flex-direction: column; gap: 6px;
  }
  .otd-label { font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-3); }
  .otd-date { font-weight: 500; letter-spacing: 0; text-transform: none; }
  .otd-entries { display: flex; flex-direction: column; gap: 8px; }

  /* Desktop: years | title+badge | link all on one row */
  .otd-entry { display: flex; align-items: baseline; gap: 0; flex-wrap: nowrap; }
  .otd-years { color: var(--ink-3); font-size: 13px; white-space: nowrap; order: 1; }
  .otd-years::after { content: " \2014\00a0"; }
  .otd-years-ago { color: var(--ink-4); font-size: 12px; }
  .otd-title-wrap { font-size: 14px; color: var(--ink); flex: 1; order: 2; }
  .otd-title-wrap strong { font-weight: 600; }
  .otd-link { font-size: 12px; color: var(--accent); cursor: pointer; white-space: nowrap;
    flex-shrink: 0; order: 3; margin-left: 12px; }
  .otd-link:hover { text-decoration: underline; }
  .otd-milestone {
    font-size: 10px; font-weight: 700; color: #6b4a00;
    background: linear-gradient(135deg, #fde68a, #fbbf24);
    padding: 1px 6px; border-radius: 4px; border: 1px solid #f4c64b;
    display: inline-block; margin-left: 6px; vertical-align: middle;
    position: relative; top: -1px;
  }

  /* Mobile: title on row 1 (full width), years + link on row 2 */
  @media (max-width: 600px) {
    .otd-entry { flex-wrap: wrap; gap: 0; row-gap: 3px; }
    .otd-title-wrap { order: 1; flex-basis: 100%; }
    .otd-years { order: 2; flex: 1; }
    .otd-years::after { display: none; }
    .otd-link { order: 3; margin-left: 8px; }
  }

  .stats {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 12px;
  }
  .stat {
    background: var(--panel);
    border: 1px solid var(--rule);
    border-radius: var(--radius);
    padding: 18px 20px;
  }
  .stat-label {
    font-size: 12px;
    color: var(--ink-3);
    margin-bottom: 10px;
  }
  .stat-v {
    font-family: var(--ff-serif);
    font-size: 36px;
    font-weight: 600;
    line-height: 1;
    letter-spacing: -0.02em;
  }
  .stat-v .u {
    font-size: 15px; color: var(--ink-3); font-weight: 400; margin-left: 4px;
  }
  .stat-sub {
    margin-top: 8px;
    font-size: 13px;
    color: var(--ink-2);
  }
  .stat-sub strong { color: var(--ink); font-weight: 600; }


  /* Tag filter bar */
  .tag-filter {
    display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px;
    padding: 10px 14px;
    background: var(--panel); border: 1px solid var(--rule); border-radius: var(--radius);
  }
  .tag-filter-label { font-size: 11px; font-weight: 600; color: var(--ink-3); align-self: center; margin-right: 4px; }
  .tf-btn {
    background: var(--panel-2); border: 1px solid var(--rule);
    color: var(--ink-2); font: inherit; font-size: 11px; font-weight: 500;
    padding: 3px 10px; border-radius: 5px; cursor: pointer;
    transition: all 0.1s;
  }
  .tf-btn:hover { border-color: var(--ink-3); color: var(--ink); }
  .tf-btn.tf-clear { background: transparent; border-style: dashed; color: var(--ink-4); }
  .tf-btn.tf-clear:hover { background: var(--panel-2); border-color: var(--ink-3); color: var(--ink-2); }
  .tf-btn.active { background: var(--ink); border-color: var(--ink); color: #fff; }
  .tf-btn[data-cat="location"].active { background: #6b3fa0; border-color: #6b3fa0; }
  .tf-btn[data-cat="genre"].active    { background: #1565c0; border-color: #1565c0; }
  .tf-btn[data-cat="access"].active   { background: #2f5d8a; border-color: #2f5d8a; }
  .tf-btn[data-cat="date"].active     { background: #4c4cae; border-color: #4c4cae; }
  .tf-btn[data-cat="time"].active     { background: #a42299; border-color: #a42299; }
  .tf-btn[data-cat="custom"].active   { background: var(--ink-2); border-color: var(--ink-2); }
  .tf-btn.tf-milestone.active { background: linear-gradient(135deg, #fde68a, #fbbf24); border-color: #f4c64b; color: #6b4a00; }
  .tf-divider { width: 1px; background: var(--rule); align-self: stretch; margin: 0 3px; }

  /* Toolbar */
  .toolbar { display: flex; gap: 12px; align-items: center; margin-bottom: 14px; }
  .search { flex: 1; position: relative; }
  .search input {
    width: 100%; background: var(--panel); border: 1px solid var(--rule);
    border-radius: var(--radius); color: var(--ink);
    font-family: inherit; font-size: 14px;
    padding: 10px 36px 10px 38px;
    outline: none;
    transition: border-color 0.15s, box-shadow 0.15s;
  }
  .search input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  .search::before {
    content: "⌕"; position: absolute; left: 14px; top: 50%; transform: translateY(-50%);
    color: var(--ink-3); font-size: 22px;
  }
  .search-clear {
    position: absolute; right: 10px; top: 50%; transform: translateY(-50%);
    background: var(--ink-4); border: none; border-radius: 50%; color: #fff;
    font-size: 8px; width: 13px; height: 13px; line-height: 13px; text-align: center;
    cursor: pointer; display: none; padding: 0;
  }
  .search-clear:hover { background: var(--ink-3); }
  .search.has-value .search-clear { display: block; }
  .sort { display: flex; gap: 4px; background: var(--panel); border: 1px solid var(--rule); border-radius: var(--radius); padding: 3px; }
  .sort button {
    background: none; border: none; color: var(--ink-2);
    font: inherit; font-size: 13px; padding: 6px 12px;
    cursor: pointer; border-radius: 7px;
  }
  .sort button.active { background: var(--ink); color: #fff; }
  .sort button:not(.active):hover { color: var(--ink); background: var(--panel-2); }

  /* Repertoire */
  .rep { background: var(--panel); border: 1px solid var(--rule); border-radius: var(--radius); overflow: hidden; }
  .rep-row {
    display: grid;
    grid-template-columns: 48px 96px 1fr 180px 120px 160px 20px;
    align-items: center;
    gap: 16px;
    padding: var(--row-pad) 20px;
    border-bottom: 1px solid var(--rule-2);
    cursor: pointer;
    transition: background 0.1s;
    position: relative;
  }
  .rep-row:last-child { border-bottom: none; }
  .rep-row:hover { background: var(--panel-2); }
  .rep-row:hover .rep-title { color: var(--accent); }
  .rep-thumb {
    width: 52px;
    background: var(--panel-2);
    overflow: hidden;
    position: relative;
    box-shadow: var(--shadow-sm);
    flex-shrink: 0;
  }
  .rep-thumb img { width: 100%; height: auto; display: block; }
  .rep-thumb.empty { height: 78px; }
  .rep-thumb.empty::after {
    content: "♪"; position: absolute; inset: 0;
    display: grid; place-items: center;
    color: var(--ink-4); font-size: 18px;
  }
  .rep-date {
    font-size: 12px; color: var(--ink-3);
    font-variant-numeric: tabular-nums;
    letter-spacing: 0.01em;
  }
  .date-mini { display: none; }
  .rep-title {
    font-size: 16px; font-weight: 600; color: var(--ink);
    line-height: 1.25;
    transition: color 0.15s;
  }
  .rep-title .by {
    display: block; font-family: var(--ff-serif);
    font-size: 13px; font-style: italic; font-weight: 400;
    color: var(--ink-3); margin-top: 2px;
  }
  .rep-venue { font-size: 13px; color: var(--ink-2); }
  .rep-rating {
    font-size: 13px; letter-spacing: 0;
    color: var(--accent); white-space: nowrap;
    display: flex; align-items: center; gap: 5px; flex-wrap: wrap;
  }
  .star-row { display: flex; gap: 1px; }
  .star-row .s-full { color: var(--accent); }
  .star-row .s-half { position: relative; display: inline-block; }
  .star-row .s-half::before { content: "★"; color: var(--ink-4); }
  .star-row .s-half::after { content: "★"; color: var(--accent); position: absolute; left: 0; top: 0; width: 50%; overflow: hidden; }
  .star-row .s-empty { color: var(--ink-4); }
  .grade-pill {
    font-size: 10px; font-weight: 700;
    background: var(--accent); color: #fff;
    padding: 1px 5px; border-radius: 3px;
    letter-spacing: 0.02em; direction: ltr;
  }
  .grade-pill[data-grade="A+"] { background:#1b5e20; color:#e8f5e9; }
  .grade-pill[data-grade="A"]  { background:#2e7d32; color:#f1f8e9; }
  .grade-pill[data-grade="A-"] { background:#388e3c; color:#f1f8e9; }
  .grade-pill[data-grade="B+"] { background:#558b2f; color:#f9fbe7; }
  .grade-pill[data-grade="B"]  { background:#689f38; color:#f9fbe7; }
  .grade-pill[data-grade="B-"] { background:#7cb342; color:#f9fbe7; }
  .grade-pill[data-grade="C+"] { background:#f9a825; color:#2d1a00; }
  .grade-pill[data-grade="C"]  { background:#f57f17; color:#fff3e0; }
  .grade-pill[data-grade="C-"] { background:#ef6c00; color:#fff3e0; }
  .grade-pill[data-grade="D+"] { background:#e64a19; color:#fff8f6; }
  .grade-pill[data-grade="D"]  { background:#d84315; color:#fff8f6; }
  .grade-pill[data-grade="D-"] { background:#bf360c; color:#fff3ee; }
  .grade-pill[data-grade="F"]  { background:#b71c1c; color:#fff0f0; }
  .rep-tags { display: flex; flex-wrap: wrap; gap: 4px; justify-content: flex-end; }
  .rep-arrow { color: var(--ink-4); font-size: 14px; text-align: right; transition: transform 0.15s, color 0.15s; }
  .rep-row:hover .rep-arrow { color: var(--accent); transform: translateX(2px); }

  .chip {
    display: inline-flex; align-items: center;
    font-size: 11px; font-weight: 500;
    padding: 2px 8px; border-radius: 4px;
    color: var(--ink-2); background: var(--panel-2);
    border: 1px solid var(--rule);
    white-space: nowrap;
    line-height: 1.4;
  }
  .chip[data-cat="location"] { color: #6b3fa0; background: #f2ebf9; border-color: #e0cff0; }
  .chip[data-cat="genre"]    { color: #1565c0; background: #e5f0fa; border-color: #cbe0f4; }
  .chip[data-cat="access"]   { color: #2f5d8a; background: #e4edf6; border-color: #cddeed; }
  .chip[data-cat="date"]     { color: #4c4cae; background: #eaeaf6; border-color: #d7d7ea; }
  .chip[data-cat="time"]     { color: #a42299; background: #f8e4f6; border-color: #edcbea; }
  .chip[data-cat="custom"]   { color: var(--ink-2); background: var(--panel-2); border-style: dashed; }
  .chip-seat { color: #8e4ba3; background: #f5e9f8; border-color: #e7d3ee; }

  .rep-milestone {
    font-size: 10px; font-weight: 700;
    letter-spacing: 0;
    color: #6b4a00;
    background: linear-gradient(135deg, #fde68a, #fbbf24);
    padding: 2px 8px; border-radius: 4px;
    border: 1px solid #f4c64b;
    display: inline-block;
    width: fit-content;
    margin-bottom: 5px;
  }
  .rep-title-text { display: block; }

  /* View toggles */
  .view-bar { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
  .view-toggle { display: flex; background: var(--panel); border: 1px solid var(--rule); border-radius: 8px; padding: 3px; gap: 2px; }
  .vt-btn { background: none; border: none; color: var(--ink-2); font: inherit; font-size: 12px; font-weight: 500; padding: 5px 12px; border-radius: 6px; cursor: pointer; }
  .vt-btn.active { background: var(--ink); color: #fff; }
  .vt-btn:not(.active):hover { color: var(--ink); background: var(--panel-2); }
  .future-toggle { display: flex; align-items: center; gap: 7px; font-size: 12px; color: var(--ink-3); margin-left: auto; cursor: pointer; user-select: none; }
  .future-toggle input { accent-color: var(--accent); cursor: pointer; width: 15px; height: 15px; }

  /* Grid view */
  .rep-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 12px; }
  .rep-grid-card { background: var(--panel); border: 1px solid var(--rule); border-radius: 0 0 8px 8px; overflow: hidden; cursor: pointer; transition: transform 0.15s, box-shadow 0.15s; }
  .rep-grid-card:hover { transform: translateY(-3px); box-shadow: var(--shadow-md); }
  .rep-grid-cover { background: var(--panel-2); overflow: hidden; position: relative; }
  .rep-grid-cover img { width: 100%; height: auto; display: block; }
  .rep-grid-cover.empty { aspect-ratio: 0.72; display: grid; place-items: center; color: var(--ink-4); font-size: 28px; }
  .rep-grid-cover .grid-milestone { display: none; }
  .rep-grid-milestone-strip {
    background: linear-gradient(135deg, #fde68a, #fbbf24);
    border-top: 1px solid #f4c64b;
    border-bottom: 1px solid #f4c64b;
    color: #6b4a00;
    font-size: 10px; font-weight: 700;
    letter-spacing: 0;
    padding: 5px 10px;
    text-align: center;
  }
  .rep-grid-info { padding: 8px 10px 10px; }
  .rep-grid-title { font-size: 12px; font-weight: 600; line-height: 1.3; color: var(--ink); }
  .rep-grid-sub { font-size: 11px; color: var(--ink-3); margin-top: 3px; }
  .rep-grid-rating { margin-top: 5px; font-size: 11px; color: var(--accent); display: flex; align-items: center; gap: 4px; flex-wrap: wrap; }

  .rep-row.hebrew .rep-title,
  .rep-row.hebrew .rep-venue { direction: rtl; unicode-bidi: embed; font-family: var(--ff-heb); }

  .rep-empty { padding: 60px 20px; text-align: center; color: var(--ink-3); }
  .show-more {
    margin: 20px auto 0;
    display: block;
    background: var(--panel); border: 1px solid var(--rule);
    color: var(--ink-2); font: inherit; font-size: 13px; font-weight: 500;
    padding: 10px 22px; border-radius: var(--radius);
    cursor: pointer;
  }
  .show-more:hover { border-color: var(--accent); color: var(--accent); }

  /* Leaderboards */
  .boards { display: grid; grid-template-columns: 1fr 1fr 2fr; gap: var(--gap); margin-bottom: var(--gap); }
  .boards-3 { display: grid; grid-template-columns: 0.6fr 1.0fr 1.4fr; gap: var(--gap); margin-bottom: var(--gap); }
  .boards-genre { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: var(--gap); margin-bottom: var(--gap); }
  /* Boards collapse */
  #boards-outer { position: relative; }
  #boards-outer.boards-collapsed { overflow: hidden; }
  .boards-fade-overlay {
    display: none; position: absolute; bottom: 0; left: 0; right: 0;
    height: 130px; pointer-events: none;
    background: linear-gradient(to bottom, transparent, var(--bg) 77%);
  }
  #boards-outer.boards-collapsed .boards-fade-overlay { display: block; }
  #boards-more-wrap { display: none; justify-content: center; margin-top: 16px; }
  #boards-outer.boards-collapsed + #boards-more-wrap { display: flex; }
  #boards-more-btn, .boards-show-less button {
    pointer-events: auto; cursor: pointer;
    background: var(--panel); border: 1px solid var(--rule);
    color: var(--ink-2); font: inherit; font-size: 13px; font-weight: 500;
    padding: 10px 22px; border-radius: var(--radius);
  }
  #boards-more-btn:hover, .boards-show-less button:hover { border-color: var(--accent); color: var(--accent); }
  .boards-show-less { display: none; justify-content: center; padding: 20px 0 0; }
  #boards-outer:not(.boards-collapsed) .boards-show-less { display: flex; }
  .boards-seats { display: grid; grid-template-columns: 1fr 1fr 1.5fr; gap: var(--gap); margin-bottom: var(--gap); }

  /* Funnel chart */
  .funnel-chart { display: flex; flex-direction: column; gap: 3px; flex: 1; justify-content: center; }
  .funnel-row { display: flex; align-items: center; gap: 6px; }
  .funnel-lbl { font-size: 11px; font-weight: 600; color: var(--ink-2); width: 16px; text-align: right; flex-shrink: 0; }
  .funnel-track { flex: 1; display: flex; justify-content: flex-start; }
  .funnel-bar { background: var(--accent); border-radius: 3px; height: 18px; display: flex; align-items: center; justify-content: space-between; padding: 0 6px; gap: 4px; min-width: 24px; opacity: 0.85; }

<script>
// ───────────── CSV + parse ─────────────
function parseCSV(text) {
  const rows = []; let row = [], cell = "", inQ = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i], n = text[i+1];
    if (inQ) {
      if (c === '"' && n === '"') { cell += '"'; i++; }
      else if (c === '"') inQ = false;
      else cell += c;
    } else {
      if (c === '"') inQ = true;
      else if (c === ',') { row.push(cell); cell = ""; }
      else if (c === '\r') {}
      else if (c === '\n') { row.push(cell); rows.push(row); row = []; cell = ""; }
      else cell += c;
    }
  }
  if (cell.length || row.length) { row.push(cell); rows.push(row); }
  return rows.filter(r => r.some(x => x && x.trim().length));
}

function findCol(headers, aliases) {
  const lc = headers.map(h => (h||"").toLowerCase().trim());
  for (const a of aliases) { const i = lc.findIndex(h => h === a.toLowerCase()); if (i >= 0) return i; }
  for (const a of aliases) { const i = lc.findIndex(h => h.includes(a.toLowerCase())); if (i >= 0) return i; }
  return -1;
}

const MONTH_MAP = { january:0,jan:0,february:1,feb:1,march:2,mar:2,april:3,apr:3,may:4,june:5,jun:5,july:6,jul:6,august:7,aug:7,september:8,sep:8,sept:8,october:9,oct:9,november:10,nov:10,december:11,dec:11 };
function parseDate(s) {
  if (!s) return null;
  s = String(s).trim();
  let m = s.match(/^([A-Za-z]+)\s+(\d{1,2}),?\s+(\d{4})\b/);
  if (m) { const mo = MONTH_MAP[m[1].toLowerCase()]; if (mo !== undefined) { const d = new Date(+m[3], mo, +m[2]); if (!isNaN(d)) return d; } }
  m = s.match(/^(\d{1,2})\s+([A-Za-z]+)\s+(\d{4})\b/);
  if (m) { const mo = MONTH_MAP[m[2].toLowerCase()]; if (mo !== undefined) { const d = new Date(+m[3], mo, +m[1]); if (!isNaN(d)) return d; } }
  const norm = s.replace(/(\d)(AM|PM|am|pm)\b/, "$1 $2");
  let d = new Date(norm); if (!isNaN(d)) return d;
  d = new Date(s); if (!isNaN(d)) return d;
  m = s.match(/^(\d{1,2})[\/\-\.](\d{1,2})[\/\-\.](\d{2,4})$/);
  if (m) { let [_, a, b, y] = m; if (y.length === 2) y = "20" + y; d = new Date(+y, +a - 1, +b); if (!isNaN(d)) return d; }
  return null;
}

function parseRating(s) {
  if (!s) return null; s = s.trim();
  const letter = { "A+":5,"A":4.7,"A-":4.3,"B+":4,"B":3.7,"B-":3.3,"C+":3,"C":2.7,"C-":2.3,"D+":2,"D":1.7,"D-":1.3,"F":1 };
  if (letter[s.toUpperCase()] !== undefined) return letter[s.toUpperCase()];
  const stars = (s.match(/[★⭐*]/g) || []).length; if (stars) return stars;
  const frac = s.match(/^([\d.]+)\s*\/\s*(\d+)/); if (frac) return (parseFloat(frac[1]) / parseFloat(frac[2])) * 5;
  const n = parseFloat(s); if (!isNaN(n)) { if (n <= 5) return n; if (n <= 10) return n / 2; if (n <= 100) return n / 20; }
  return null;
}

function resolveCover(b64, url) {
  if (b64) {
    const s = b64.trim();
    if (s.startsWith("data:")) return s;
    if (/^[A-Za-z0-9+/=\s]+$/.test(s) && s.length > 200) return "data:image/jpeg;base64," + s.replace(/\s+/g, "");
  }
  if (url) {
    const m = url.match(/\/d\/([a-zA-Z0-9_-]+)/) || url.match(/[?&]id=([a-zA-Z0-9_-]+)/);
    if (m) return `https://drive.google.com/thumbnail?id=${m[1]}&sz=w800`;
    return url;
  }
  return "";
}

const TAG_DEFS = [
  ["broadway","Broadway","location"],["offbway","Off-Broadway","location"],["off-broadway","Off-Broadway","location"],["off-bway","Off-Broadway","location"],
  ["nationaltour","National Tour","location"],["national tour","National Tour","location"],
  ["israel","Israel","location"],["westend","West End","location"],["west end","West End","location"],
  ["play","Play","genre"],["musical","Musical","genre"],["concert","Concert","genre"],
  ["audiencerewards","Audience Rewards","access"],["audience rewards","Audience Rewards","access"],
  ["lottery","Lottery","access"],["rush","Rush","access"],
  ["preview","Preview","date"],["firstpreview","First Preview","date"],["first preview","First Preview","date"],
  ["final","Closing","date"],["closing","Closing","date"],
  ["matinee","Matinee","time"],["evening","Evening","time"],
];

function buildEntries(rows) {
  if (rows.length < 2) return [];
  const headers = rows[0];
  const cols = {
    date: findCol(headers,["date","seen","performance date","when"]),
    title: findCol(headers,["title","show","production","play","name"]),
    venue: findCol(headers,["venue","theatre","theater","house","location"]),
    rating: findCol(headers,["rating","stars","score"]),
    grade: findCol(headers,["grade","letter grade"]),
    type: findCol(headers,["type","category","kind","genre"]),
    playwright: findCol(headers,["playwright","writer","author","by","book"]),
    director: findCol(headers,["director","directed by"]),
    translator: findCol(headers,["translated by"]),
    composer: findCol(headers,["composer","music"]),
    notes: findCol(headers,["notes","review","thoughts","comment","diary","description"]),
    cast: findCol(headers,["cast","starring","performers"]),
    company: findCol(headers,["company","troupe","producer"]),
    playbill: findCol(headers,["playbill cover","playbill","cover","poster","image"]),
    playbill64: findCol(headers,["playbill64","playbill base64","cover64"]),
    seat: findCol(headers,["seat"]),
    seatRow: findCol(headers,["seat row"]),
    seatNum: findCol(headers,["seat number","seat num"]),
    seatLocation: findCol(headers,["seat location","section"]),
    milestone: findCol(headers,["milestone"]),
    theaterCity: findCol(headers,["theater+city","theatre+city","venue+city"]),
  };
  const TAG_LOOKUP = {};
  for (const [k, l, c] of TAG_DEFS) { TAG_LOOKUP[k.toLowerCase()] = { label: l, cat: c }; TAG_LOOKUP[l.toLowerCase()] = { label: l, cat: c }; }
  const tagCols = TAG_DEFS.map(([key, label, cat]) => {
    const i = headers.findIndex(h => (h||"").toLowerCase().trim() === key);
    return i >= 0 ? { i, label, cat } : null;
  }).filter(Boolean);
  const tagsCol = headers.findIndex(h => (h||"").toLowerCase().trim() === "tags");
  const customTagsCol = headers.findIndex(h => (h||"").toLowerCase().trim() === "custom tags");
  const HIDDEN = new Set([
    "theater+city","theatre+city","numerical grade","numeric grade","grade","letter grade",
    "seat row","seat number","seat number for grid","seat location","seat name",
    "row as number","helper column","helper",
    "playbill cover","playbill64","tags","custom tags",
    ...TAG_DEFS.map(t => t[0])
  ].map(s => s.toLowerCase()));

  const out = [];
  for (let r = 1; r < rows.length; r++) {
    const row = rows[r];
    const g = (k) => cols[k] >= 0 ? (row[cols[k]] || "").trim() : "";
    const e = {
      date: parseDate(g("date")), dateRaw: g("date"),
      title: g("title"), venue: g("venue"),
      rating: parseRating(g("rating")), ratingRaw: g("rating"),
      grade: g("grade"),
      type: g("type"), playwright: g("playwright"),
      director: g("director"), composer: g("composer"), translator: g("translator"),
      notes: g("notes"), cast: g("cast"), company: g("company"),
      seat: g("seat"), seatRow: g("seatRow"), seatLocation: g("seatLocation"),
      seatNum: (() => { const n = parseInt(g("seatNum"), 10); return isNaN(n) ? null : n; })(),
      milestone: g("milestone"),
      theaterCity: g("theaterCity"),
      tags: [], extra: {}
    };
    const seen = new Set();
    for (const tc of tagCols) {
      const v = (row[tc.i] || "").trim().toLowerCase();
      const truthy = v && v !== "0" && v !== "false" && v !== "no" && v !== "-" && v !== "n";
      if (truthy && !seen.has(tc.label)) { seen.add(tc.label); e.tags.push({ label: tc.label, cat: tc.cat }); }
    }
    const ts = [];
    if (tagsCol >= 0) ts.push(row[tagsCol] || "");
    if (customTagsCol >= 0) ts.push(row[customTagsCol] || "");
    for (const s of ts) for (const raw of s.split(/[,;|]/)) {
      const t = raw.trim(); if (!t) continue;
      const m = TAG_LOOKUP[t.toLowerCase()];
      if (m && !seen.has(m.label)) { seen.add(m.label); e.tags.push({ label: m.label, cat: m.cat }); }
      else if (!m && !seen.has(t)) { seen.add(t); e.tags.push({ label: t, cat: "custom" }); }
    }
    e.isHebrew = /[\u0590-\u05FF]/.test(e.title || "");
    e.isPlay = e.tags.some(t => /^play$/i.test(t.label.trim())) || /^play$/i.test((e.type||'').trim());
    headers.forEach((h, i) => {
      const used = Object.values(cols).includes(i);
      const hLow = (h || "").toLowerCase().trim();
      if (!used && !HIDDEN.has(hLow) && row[i] && row[i].trim()) e.extra[h] = row[i].trim();
    });
    // Inject Matinee/Evening from showtime extra column into tags for filtering
    const showtimeRaw = ((Object.entries(e.extra).find(([k]) => /^showtime$/i.test(k.trim())) || [])[1] || '').trim();
    if (/^matinee$/i.test(showtimeRaw) && !seen.has('Matinee')) { seen.add('Matinee'); e.tags.push({ label: 'Matinee', cat: 'time' }); }
    else if (/^evening$/i.test(showtimeRaw) && !seen.has('Evening')) { seen.add('Evening'); e.tags.push({ label: 'Evening', cat: 'time' }); }
    e.coverSrc = resolveCover(
      cols.playbill64 >= 0 ? (row[cols.playbill64] || "").trim() : "",
      cols.playbill >= 0 ? (row[cols.playbill] || "").trim() : ""
    );
    if (e.title || e.dateRaw) out.push(e);
  }
  return out;
}

// ───────────── State + render ─────────────
let ENTRIES = [];
let VIEW = { sort: "date-desc", search: "", limit: 10, activeTagByGroup: {}, mode: "grid", hideFuture: true, milestoneOnly: false };
const isTouch = window.matchMedia('(hover: none) and (pointer: coarse)').matches;

async function load() {
  try {
    const [res] = await Promise.all([
      fetch(SHEET_CSV_URL),
      new Promise(r => setTimeout(r, 800))
    ]);
    if (!res.ok) throw new Error("HTTP " + res.status);
    const text = await res.text();
    ENTRIES = buildEntries(parseCSV(text));
    render();
  } catch (err) {
    document.getElementById("main").innerHTML = `
      <div class="errstate">
        Couldn't load the sheet.
        <code>${err.message}</code>
        <div style="margin-top:12px;font-size:13px;color:var(--ink-3);">Make sure it's still published as CSV.</div>
      </div>`;
  }
}

const MONTHS = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const MONTHS_FULL = ["January","February","March","April","May","June","July","August","September","October","November","December"];
const fmtDate = d => d ? `${MONTHS[d.getMonth()]} ${d.getDate()}, ${d.getFullYear()}` : "—";
const fmtDateShort = d => d ? `${MONTHS[d.getMonth()]} ${d.getDate()}, ${d.getFullYear()}` : "—";
const fmtDateMini  = d => d ? `${d.getMonth()+1}/${d.getDate()}/${String(d.getFullYear()).slice(-2)}` : "—";

// For entries in 2012 or earlier, day=1 means month is approximate; Jan 1 means year only
const DAY_NAMES = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
function datePrecision(d) {
  if (!d || d.getFullYear() > 2012) return 'full';
  if (d.getMonth() === 0 && d.getDate() === 1) return 'year';
  if (d.getDate() === 1) return 'month';
  return 'full';
}
const fmtDateDetail = d => {
  if (!d) return '—';
  const p = datePrecision(d);
  if (p === 'year')  return String(d.getFullYear());
  if (p === 'month') return `${MONTHS_FULL[d.getMonth()]} ${d.getFullYear()}`;
  return `${DAY_NAMES[d.getDay()]}, ${MONTHS_FULL[d.getMonth()]} ${d.getDate()}, ${d.getFullYear()}`;
};
const fmtDateApprox = d => {
  if (!d) return '—';
  const p = datePrecision(d);
  if (p === 'year')  return String(d.getFullYear());
  if (p === 'month') return `${MONTHS[d.getMonth()]} ${d.getFullYear()}`;
  return fmtDateShort(d);
};
const fmtDateMiniApprox = d => {
  if (!d) return '—';
  const p = datePrecision(d);
  if (p === 'year')  return String(d.getFullYear());
  if (p === 'month') return `${d.getMonth()+1}/${d.getFullYear()}`;
  return fmtDateMini(d);
};
function stars(r) {
  if (r == null) return '';
  const rounded = Math.round(r * 2) / 2;
  const full = Math.floor(rounded);
  const half = rounded - full >= 0.5;
  return `<span class="star-row">${'★'.repeat(full)}${half ? '½' : ''}</span>`;
}

function avgLetterGrade(avg) {
  if (avg == null) return '';
  const score = avg * 10 + 50;
  if (score >= 97) return 'A+';
  if (score >= 93) return 'A';
  if (score >= 90) return 'A-';
  if (score >= 87) return 'B+';
  if (score >= 83) return 'B';
  if (score >= 80) return 'B-';
  if (score >= 77) return 'C+';
  if (score >= 73) return 'C';
  if (score >= 70) return 'C-';
  if (score >= 67) return 'D+';
  if (score >= 65) return 'D';
  if (score >= 60) return 'F';
  return 'F';
}
function esc(s) { return String(s ?? "").replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function seenEntries() { const now = new Date(); now.setHours(0,0,0,0); return ENTRIES.filter(e => !e.date || e.date <= now); }

function render() {
  const main = document.getElementById("main");
  const seen = seenEntries();
  const total = seen.length;
  const dated = seen.filter(e => e.date).sort((a,b) => b.date - a.date);
  document.getElementById("hd-last").textContent = dated[0] ? `Latest entry: ${fmtDate(dated[0].date)}` : "no dates";
  if (!total) { main.innerHTML = `<div class="errstate">Diary is empty.</div>`; return; }
  const parts = [];
  parts.push(renderOnThisDay());
  parts.push(renderStats());
  parts.push(renderRepertoire());
  parts.push(renderBoards());
  parts.push(renderSeatMap());
  parts.push(renderMap());
  main.innerHTML = parts.join("");
  attachListeners();
  initSeatMap();
  initMap();
}

function renderOnThisDay() {
  const today = new Date();
  const mm = today.getMonth(), dd = today.getDate(), yyyy = today.getFullYear();
  const matches = seenEntries().filter(e =>
    e.date &&
    datePrecision(e.date) === 'full' &&
    e.date.getMonth() === mm &&
    e.date.getDate() === dd &&
    e.date.getFullYear() < yyyy
  ).sort((a, b) => b.date - a.date);
  if (!matches.length) return '';
  const dateLabel = `${MONTHS_FULL[mm]} ${dd}`;
  const entries = matches.map(e => {
    const years = yyyy - e.date.getFullYear();
    const idx = ENTRIES.indexOf(e);
    const milestoneHtml = e.milestone ? `<span class="otd-milestone">${esc(e.milestone)}</span>` : '';
    const yearsHtml = `<span class="otd-years">${e.date.getFullYear()} <span class="otd-years-ago">(${years} year${years===1?'':'s'} ago)</span></span>`;
    const isHeb = /[֐-׿]/.test(e.title||'');
    const titleStyle = isHeb ? ` style="font-family:var(--ff-heb);direction:rtl;unicode-bidi:embed"` : '';
    return `<div class="otd-entry">
      <span class="otd-title-wrap"><strong${titleStyle}>${esc(e.title||'')}</strong>${milestoneHtml}</span>
      ${yearsHtml}
      <span class="otd-link" onclick="openDetail(${idx})">View details</span>
    </div>`;
  }).join('');
  return `<div class="otd-wrap">
    <div class="otd-label">On this day <span class="otd-date">— ${dateLabel}</span></div>
    <div class="otd-entries">${entries}</div>
  </div>`;
}

function renderStats() {
  const seen = seenEntries();
  const total = seen.length;
  const rated = seen.filter(e => e.rating != null);
  const avg = rated.length ? rated.reduce((s,e)=>s+e.rating,0)/rated.length : null;
  const venueCount = new Set(seen.map(e => e.venue).filter(Boolean)).size;
  const uniqueShows = new Set(seen.map(e => (e.title||"").trim().toLowerCase()).filter(Boolean)).size;
  const thisYear = new Date().getFullYear();
  const tyCount = seen.filter(e => e.date?.getFullYear() === thisYear).length;
  return `
    <div class="sec-hd"><h2>At a glance</h2><div class="rule"></div></div>
    <section class="stats">
      <div class="stat"><div class="stat-label">Total</div><div class="stat-v">${total}</div><div class="stat-sub">performances</div></div>
      <div class="stat"><div class="stat-label">Average rating</div><div class="stat-v">${avg != null ? avg.toFixed(2) : "—"}<span class="u">/5</span></div><div class="stat-sub">${avg != null ? `<span class="grade-pill" data-grade="${avgLetterGrade(avg)}" style="font-size:14px;padding:2px 8px">${avgLetterGrade(avg)}</span>` : ""}</div></div>
      <div class="stat"><div class="stat-label">This year (${thisYear})</div><div class="stat-v">${tyCount}</div><div class="stat-sub">so far</div></div>
      <div class="stat"><div class="stat-label">Theaters visited</div><div class="stat-v">${venueCount}</div><div class="stat-sub">venues</div></div>
      <div class="stat"><div class="stat-label">Unique shows seen</div><div class="stat-v">${uniqueShows}</div><div class="stat-sub">distinct titles</div></div>
    </section>`;
}


function buildTagFilters() {
  const catOrder = ['location','genre','access','date','time','custom'];
  const DATE_ORDER = ['Preview','First Preview','Closing'];
  const bycat = {};
  ENTRIES.forEach(e => (e.tags||[]).forEach(t => {
    if (!bycat[t.cat]) bycat[t.cat] = new Map();
    bycat[t.cat].set(t.label, t);
  }));
  // Ensure Musical appears in genre even if not tagged (virtual tag)
  if (!bycat['genre']) bycat['genre'] = new Map();
  if (!bycat['genre'].has('Musical')) bycat['genre'].set('Musical', { label: 'Musical', cat: 'genre' });
  bycat['genre']?.delete('Concert');
  const groups = catOrder.filter(c => bycat[c]);
  if (!groups.length) return '';
  const hasActive = Object.values(VIEW.activeTagByGroup).some(Boolean) || VIEW.milestoneOnly;
  const btns = groups.map((cat, gi) => {
    let tags = [...bycat[cat].values()];
    if (cat === 'date') tags.sort((a, b) => { const ai = DATE_ORDER.indexOf(a.label); const bi = DATE_ORDER.indexOf(b.label); return (ai < 0 ? 99 : ai) - (bi < 0 ? 99 : bi); });
    const divider = gi > 0 ? '<div class="tf-divider"></div>' : '';
    return divider + tags.map(t => `<button class="tf-btn${VIEW.activeTagByGroup[cat]===t.label?' active':''}" data-cat="${t.cat}" data-label="${esc(t.label)}">${esc(t.label)}</button>`).join('');
  }).join('');
  const milestoneBtn = `<div class="tf-divider"></div><button class="tf-btn tf-milestone${VIEW.milestoneOnly?' active':''}">Milestone</button>`;
  const clearBtn = hasActive ? `<div class="tf-divider"></div><button class="tf-btn tf-clear">Clear</button>` : '';
  return `<div class="tag-filter"><span class="tag-filter-label">Filter</span>${btns}${milestoneBtn}${clearBtn}</div>`;
}

function renderRepertoire() {
  return `
    <div class="sec-hd"><h2>Every performance</h2><div class="rule"></div></div>
    <div class="view-bar">
      <div class="view-toggle">
        <button class="vt-btn${VIEW.mode==='list'?' active':''}" id="vt-list">☰ List</button>
        <button class="vt-btn${VIEW.mode==='grid'?' active':''}" id="vt-grid">⊞ Grid</button>
      </div>
      <label class="future-toggle">
        <input type="checkbox" id="hide-future" ${VIEW.hideFuture?'checked':''}>
        hide future shows
      </label>
    </div>
    <div id="tag-filter-wrap"></div>
    <div class="toolbar">
      <div class="search${VIEW.search ? ' has-value' : ''}"><input id="search" placeholder="Search" value="${esc(VIEW.search)}"><button class="search-clear" id="search-clear" title="Clear search">✕</button></div>
      <div class="sort">
        <button data-sort="date-desc" class="${VIEW.sort==='date-desc'?'active':''}">Newest</button>
        <button data-sort="date-asc" class="${VIEW.sort==='date-asc'?'active':''}">Oldest</button>
        <button data-sort="rating-desc" class="${VIEW.sort==='rating-desc'?'active':''}">Best</button>
        <button data-sort="title-asc" class="${VIEW.sort==='title-asc'?'active':''}">A-Z</button>
      </div>
    </div>
    <div id="rep"></div>`;
}

function filterAndSort() {
  const s = VIEW.search.trim().toLowerCase();
  let list = ENTRIES.slice();
  if (VIEW.hideFuture) {
    const now = new Date(); now.setHours(0,0,0,0);
    list = list.filter(e => !e.date || e.date <= now);
  }
  if (VIEW.milestoneOnly) list = list.filter(e => e.milestone);
  if (Object.keys(VIEW.activeTagByGroup).some(k => VIEW.activeTagByGroup[k])) {
    list = list.filter(e => {
      return Object.entries(VIEW.activeTagByGroup).every(([cat, label]) => {
        if (!label) return true;
        if (cat === 'genre' && label === 'Musical') {
          // Musical = not tagged as Play or Concert
          return !(e.tags||[]).some(t => t.cat === 'genre' && (t.label === 'Play' || t.label === 'Concert'));
        }
        if (label === 'Preview') return (e.tags||[]).some(t => t.label === 'Preview' || t.label === 'First Preview');
        return (e.tags||[]).some(t => t.label === label);
      });
    });
  }
  const REVIEW_RE = /^(review|notes?|thoughts?|comments?|diary|description)$/i;
  if (s) list = list.filter(e =>
    (e.title||"").toLowerCase().includes(s) || (e.venue||"").toLowerCase().includes(s) ||
    (e.playwright||"").toLowerCase().includes(s) || (e.director||"").toLowerCase().includes(s) ||
    (e.composer||"").toLowerCase().includes(s) || (e.notes||"").toLowerCase().includes(s) ||
    (e.cast||"").toLowerCase().includes(s) || (e.milestone||"").toLowerCase().includes(s) ||
    (e.seat||"").toLowerCase().includes(s) || (e.tags||[]).some(t => t.label.toLowerCase().includes(s)) ||
    Object.entries(e.extra||{}).some(([k,v]) => REVIEW_RE.test(k.trim()) && String(v).toLowerCase().includes(s))
  );
  // Matinee = earlier in the day (0), Evening/unknown = later (1)
  const timeOrder = e => (e.tags||[]).some(t=>t.cat==='time'&&t.label==='Matinee') ? 0 : 1;
  switch (VIEW.sort) {
    case "date-desc": list.sort((a,b) => {
      const d = (b.date?.getTime()||0) - (a.date?.getTime()||0);
      return d !== 0 ? d : timeOrder(b) - timeOrder(a); // same day: evening before matinee
    }); break;
    case "date-asc": list.sort((a,b) => {
      const d = (a.date?.getTime()||Infinity) - (b.date?.getTime()||Infinity);
      return d !== 0 ? d : timeOrder(a) - timeOrder(b); // same day: matinee before evening
    }); break;
    case "rating-desc": {
      const GRADE_ORDER = ['A+','A','A-','B+','B','B-','C+','C','C-','D+','D','F'];
      list.sort((a, b) => {
        const ga = a.grade ? GRADE_ORDER.indexOf(a.grade) : GRADE_ORDER.length;
        const gb = b.grade ? GRADE_ORDER.indexOf(b.grade) : GRADE_ORDER.length;
        if (ga !== gb) return ga - gb;
        const da = a.date?.getTime() ?? Infinity, db = b.date?.getTime() ?? Infinity;
        if (da !== db) return da - db;
        return timeOrder(a) - timeOrder(b);
      }); break;
    }
    case "title-asc": { const sk = t => (t||"").replace(/^the\s+/i,""); list.sort((a,b) => sk(a.title).localeCompare(sk(b.title))); break; }
  }
  return list;
}

const TAG_CAT_ORDER = ['location','genre','access','date','time','custom'];

function buildChips(e, limit) {
  const isMusical = !(e.tags||[]).some(t => t.cat==='genre' && (t.label==='Play'||t.label==='Concert'));
  const timeTags = (e.tags||[]).filter(t => t.cat==='time');
  const showtimeExtra = !timeTags.length
    ? ((Object.entries(e.extra||{}).find(([k])=>/^showtime$/i.test(k.trim()))||[])[1]||'')
    : '';
  const all = [
    ...(isMusical ? [{label:'Musical',cat:'genre'}] : []),
    ...(e.tags||[]),
    ...(showtimeExtra ? [{label:showtimeExtra,cat:'time'}] : []),
  ].sort((a,b) => {
    const ai = TAG_CAT_ORDER.indexOf(a.cat); const bi = TAG_CAT_ORDER.indexOf(b.cat);
    return (ai<0?99:ai)-(bi<0?99:bi);
  });
  return (limit ? all.slice(0, limit) : all)
    .map(t=>`<span class="chip" data-cat="${t.cat}">${esc(t.label)}</span>`).join('');
}

function renderRepRows() {
  const filtered = filterAndSort();
  const shown = filtered.slice(0, VIEW.limit);
  const rep = document.getElementById("rep");
  if (!rep) return;
  document.querySelector(".show-more")?.remove();
  if (!filtered.length) { rep.innerHTML = `<div class="rep-empty">No entries match that search.</div>`; return; }
  if (VIEW.mode === 'grid') {
    rep.className = 'rep-grid';
    rep.innerHTML = filtered.map(e => {
      const grade = e.grade;
      return `<div class="rep-grid-card${e.isHebrew?' hebrew':''}" data-idx="${ENTRIES.indexOf(e)}">
        <div class="rep-grid-cover${e.coverSrc?'':' empty'}">
          ${e.coverSrc ? `<img src="${esc(e.coverSrc)}" alt="" referrerpolicy="no-referrer" onerror="this.parentNode.classList.add('empty');this.remove();">` : '♪'}
        </div>
        ${e.milestone ? `<div class="rep-grid-milestone-strip"${/[֐-׿]/.test(e.milestone)?` style="font-family:var(--ff-heb)"`:``}>${esc(e.milestone)}</div>` : ''}
        <div class="rep-grid-info">
          <div class="rep-grid-title">${esc(e.title||'(untitled)')}</div>
          <div class="rep-grid-sub">${e.date ? fmtDateApprox(e.date) : '—'}</div>
          <div class="rep-grid-rating">${stars(e.rating)}${grade?`<span class="grade-sep">•</span><span class="grade-pill" data-grade="${grade}">${grade}</span>`:''}</div>
        </div>
      </div>`;
    }).join('');
    requestAnimationFrame(() => {
      const cards = Array.from(rep.querySelectorAll('.rep-grid-card'));
      if (!cards.length) return;
      const firstTop = cards[0].offsetTop;
      const cols = cards.filter(c => c.offsetTop === firstTop).length || 1;
      let visible = Math.min(cols * 2, cards.length);
      const updateGrid = () => {
        document.querySelector('.show-more')?.remove();
        cards.forEach((c, i) => { c.style.display = i < visible ? '' : 'none'; });
        if (visible < cards.length) {
          const next = Math.min(cols, cards.length - visible);
          rep.insertAdjacentHTML('afterend', `<button class="show-more">Show ${next} more — of ${filtered.length}</button>`);
          document.querySelector('.show-more').addEventListener('click', () => { visible += cols; updateGrid(); });
        }
      };
      updateGrid();
    });
    return;
  }
  rep.className = 'rep';
  rep.innerHTML = shown.map(e => {
    const grade = e.grade;
    return `
    <div class="rep-row${e.isHebrew ? ' hebrew' : ''}" data-idx="${ENTRIES.indexOf(e)}">
      <div class="rep-thumb${e.coverSrc ? '' : ' empty'}">${e.coverSrc ? `<img src="${esc(e.coverSrc)}" alt="" referrerpolicy="no-referrer" onerror="this.parentNode.classList.add('empty');this.remove();">` : ""}</div>
      <div class="rep-date"><span class="date-full">${e.date ? fmtDateApprox(e.date) : "—"}</span><span class="date-mini">${e.date ? fmtDateMiniApprox(e.date) : "—"}</span></div>
      <div class="rep-title">
        ${e.milestone ? `<div class="rep-milestone">${esc(e.milestone)}</div>` : ""}
        <div class="rep-title-text">${esc(e.title || "(untitled)")}</div>
      </div>
      <div class="rep-venue">${esc(e.venue || "")}</div>
      <div class="rep-rating">${stars(e.rating)}${grade ? `<span class="grade-sep">•</span><span class="grade-pill" data-grade="${grade}">${grade}</span>` : ""}</div>
      <div class="rep-tags">${buildChips(e)}</div>
      <div class="rep-arrow">→</div>
    </div>`;
  }).join("");
  if (filtered.length > VIEW.limit) {
    rep.insertAdjacentHTML("afterend", `<button class="show-more">Show ${Math.min(10, filtered.length - VIEW.limit)} more — of ${filtered.length}</button>`);
    document.querySelector(".show-more").addEventListener("click", () => { VIEW.limit += 10; renderRepRows(); });
  }
}

function renderTagFilters() {
  const wrap = document.getElementById('tag-filter-wrap');
  if (wrap) wrap.innerHTML = buildTagFilters();
  document.querySelector('.tf-clear')?.addEventListener('click', () => {
    VIEW.activeTagByGroup = {}; VIEW.milestoneOnly = false; VIEW.limit = 10;
    renderTagFilters(); renderRepRows();
  });
  document.querySelector('.tf-milestone')?.addEventListener('click', () => {
    VIEW.milestoneOnly = !VIEW.milestoneOnly; VIEW.limit = 10;
    renderTagFilters(); renderRepRows();
  });
  document.querySelectorAll('.tf-btn:not(.tf-clear):not(.tf-milestone)').forEach(b => b.addEventListener('click', () => {
    const { label, cat } = b.dataset;
    VIEW.activeTagByGroup[cat] = VIEW.activeTagByGroup[cat] === label ? null : label;
    VIEW.limit = 10;
    renderTagFilters();
    renderRepRows();
  }));
}

function attachListeners() {
  renderTagFilters();
  renderRepRows();

  // Scorecard chip tooltips
  const scTt = document.getElementById('sc-tooltip');
  document.addEventListener('mouseover', e => {
    const chip = e.target.closest('.sc-chip[data-sc-key]');
    if (!chip) return;
    const shows = SC_SHOW_DATA[chip.dataset.scKey];
    if (!shows || !shows.length) return;
    scTt.innerHTML = shows.map(s =>
      `<div class="sc-tt-row${s.upcoming ? ' upcoming' : ''}">
        <span>${esc(s.title)}</span>
        ${s.date ? `<span class="sc-tt-date">${s.date}</span>` : ''}
      </div>`
    ).join('');
    scTt.style.display = 'block';
    const r = chip.getBoundingClientRect();
    const ttW = scTt.offsetWidth, ttH = scTt.offsetHeight;
    const top = r.top - ttH - 8 < 0 ? r.bottom + 8 : r.top - ttH - 8;
    const left = Math.min(Math.max(r.left + r.width / 2 - ttW / 2, 8), window.innerWidth - ttW - 8);
    scTt.style.top = top + 'px';
    scTt.style.left = left + 'px';
  });
  document.addEventListener('mouseout', e => {
    if (!e.target.closest('.sc-chip[data-sc-key]')) return;
    scTt.style.display = 'none';
  });
  document.getElementById("search")?.addEventListener("input", e => {
    VIEW.search = e.target.value;
    VIEW.limit = 10;
    e.target.closest('.search').classList.toggle('has-value', !!e.target.value);
    renderRepRows();
  });
  document.getElementById("search-clear")?.addEventListener("click", () => {
    const inp = document.getElementById("search");
    inp.value = ""; VIEW.search = ""; VIEW.limit = 10;
    inp.closest('.search').classList.remove('has-value');
    inp.focus();
    renderRepRows();
  });;
  document.querySelectorAll(".sort button").forEach(b => b.addEventListener("click", () => {
    VIEW.sort = b.dataset.sort; document.querySelectorAll(".sort button").forEach(x => x.classList.toggle("active", x === b));
    VIEW.limit = 10; renderRepRows();
  }));
  document.getElementById("rep").addEventListener("click", e => {
    const r = e.target.closest(".rep-row, .rep-grid-card"); if (r) openDetail(+r.dataset.idx);
  });
  document.getElementById("vt-list")?.addEventListener("click", () => {
    VIEW.mode = "list"; VIEW.limit = 10;
    document.getElementById("vt-list").classList.add("active");
    document.getElementById("vt-grid").classList.remove("active");
    renderRepRows();
  });
  document.getElementById("vt-grid")?.addEventListener("click", () => {
    VIEW.mode = "grid"; VIEW.limit = 10;
    document.getElementById("vt-grid").classList.add("active");
    document.getElementById("vt-list").classList.remove("active");
    renderRepRows();
  });
  document.getElementById("hide-future")?.addEventListener("change", e => {
    VIEW.hideFuture = e.target.checked; VIEW.limit = 10; renderRepRows();
  });
  function updateSearchPlaceholder() {
    const inp = document.getElementById("search");
    if (!inp) return;
    inp.placeholder = window.innerWidth > 620 ? "Search title, venue, creator, director, review…" : "Search";
  }
  updateSearchPlaceholder();
  window.addEventListener("resize", updateSearchPlaceholder);
  document.getElementById("show-ratings-cb")?.addEventListener("change", e => {
    document.getElementById("boards-wrap")?.classList.toggle("hide-ratings", !e.target.checked);
  });

  // Boards collapse
  (() => {
    const outer = document.getElementById("boards-outer");
    const genreEl = document.querySelector(".boards-genre");
    if (!outer || !genreEl) return;
    const outerRect = outer.getBoundingClientRect();
    const genreRect = genreEl.getBoundingClientRect();
    const genreTopOffset = genreRect.top - outerRect.top;
    const isMobile = window.innerWidth <= 900;
    const collapseH = isMobile
      ? genreTopOffset + genreRect.height / 6
      : genreTopOffset + genreRect.height / 2;
    outer.style.maxHeight = collapseH + "px";

    function expand() {
      outer.style.maxHeight = "";
      outer.classList.remove("boards-collapsed");
    }
    function collapse() {
      const lessTop = document.getElementById("boards-less-btn").getBoundingClientRect().top;
      outer.style.maxHeight = collapseH + "px";
      outer.classList.add("boards-collapsed");
      const moreTop = document.getElementById("boards-more-wrap").getBoundingClientRect().top;
      window.scrollBy({ top: moreTop - lessTop });
    }
    document.getElementById("boards-more-btn")?.addEventListener("click", expand);
    document.getElementById("boards-less-btn")?.addEventListener("click", collapse);
  })();
  const histTt = document.getElementById("hist-tt");

  function showTipAbove(el) {
    histTt.style.display = 'block';
    histTt.style.left = '-9999px'; histTt.style.top = '-9999px';
    const ttW = histTt.offsetWidth, ttH = histTt.offsetHeight;
    const rect = el.getBoundingClientRect();
    let left = rect.left + rect.width / 2 - ttW / 2;
    left = Math.max(8, Math.min(left, window.innerWidth - ttW - 8));
    let top = rect.top - ttH - 8;
    if (top < 8) top = rect.bottom + 8;
    histTt.style.left = left + 'px';
    histTt.style.top = top + 'px';
  }

  document.querySelectorAll("[data-tip]").forEach(el => {
    if (isTouch) {
      el.addEventListener("touchend", () => {
        histTt.textContent = el.dataset.tip;
        showTipAbove(el);
      }, { passive: true });
    } else {
      el.addEventListener("mousemove", ev => {
        histTt.textContent = el.dataset.tip;
        histTt.style.left = (ev.clientX + 12) + "px";
        histTt.style.top = (ev.clientY - 32) + "px";
        histTt.style.display = "block";
      });
      el.addEventListener("mouseleave", () => { histTt.style.display = "none"; });
    }
  });

  if (isTouch) {
    document.addEventListener("touchstart", () => {
      histTt.style.display = "none";
      document.getElementById("sm-tt")?.classList.remove("open");
      document.querySelector(".sm-dot-tapped")?.classList.remove("sm-dot-tapped");
    }, { passive: true });
  }
}

function renderBoards() {
  const seen = seenEntries();

  // ── Row 1: Venues / Shows / Rating distribution ──
  const venueCounts = {}; seen.forEach(e => { if (e.venue) venueCounts[e.venue]=(venueCounts[e.venue]||0)+1; });
  const venues = Object.entries(venueCounts).sort((a,b)=>b[1]-a[1]).slice(0,7);
  const showCounts = {}; seen.forEach(e => { const t=(e.title||"").trim().toLowerCase(); if(t) showCounts[t]=(showCounts[t]||[]).concat(e); });
  const shows = Object.entries(showCounts).filter(([,es])=>es.length>1).sort((a,b)=>b[1].length-a[1].length).slice(0,7).map(([,es])=>[es[0].title,es.length]);
  const buckets=[0,0,0,0,0,0,0,0,0];
  seen.forEach(e=>{ if(e.rating==null) return; const i=Math.min(8,Math.max(0,Math.round(e.rating*2)-2)); buckets[i]++; });
  const maxB=Math.max(1,...buckets);

  // ── Row 2: Seat analysis ──
  const hasTag = (e, label) => (e.tags||[]).some(t=>t.label===label);
  const isIsrael = e => hasTag(e, 'Israel');
  const isBroadwayStyle = e => hasTag(e,'Broadway') || hasTag(e,'Off-Broadway') || hasTag(e,'National Tour');

  // Row: everything except Israel
  const seatedRow = seen.filter(e=>e.seatRow && !isIsrael(e));
  const rowMap = {};
  seatedRow.forEach(e => {
    const r = (ROW_ALIASES[e.seatRow]||e.seatRow||'').toUpperCase();
    if (!r) return;
    if (!rowMap[r]) rowMap[r]={count:0,ratings:[]};
    rowMap[r].count++;
    if (e.rating!=null) rowMap[r].ratings.push(e.rating);
  });
  const topRows = Object.entries(rowMap).sort((a,b)=>b[1].count-a[1].count).slice(0,7)
    .map(([r,d])=>({r, count:d.count, avg:d.ratings.length?d.ratings.reduce((s,v)=>s+v,0)/d.ratings.length:null}));
  const maxRow = Math.max(1,...topRows.map(x=>x.count));

  // Section: Broadway, Off-Broadway, National Tour
  const seatedSection = seen.filter(e=>e.seatRow && isBroadwayStyle(e));
  const secs = {'House Left':{count:0,ratings:[]},'Center':{count:0,ratings:[]},'House Right':{count:0,ratings:[]}};
  seatedSection.forEach(e => {
    if (e.seatNum==null) return;
    const sec = e.seatNum>=101?'Center':e.seatNum%2===1?'House Left':'House Right';
    secs[sec].count++;
    if (e.rating!=null) secs[sec].ratings.push(e.rating);
  });
  const secTotal = Object.values(secs).reduce((s,d)=>s+d.count,0)||1;

  // Level: all shows
  const levels = {};
  seen.filter(e=>e.seatLocation).forEach(e=>{
    if(!levels[e.seatLocation]) levels[e.seatLocation]={count:0,ratings:[]};
    levels[e.seatLocation].count++;
    if(e.rating!=null) levels[e.seatLocation].ratings.push(e.rating);
  });
  const PIE_COLORS = {'Orchestra':'var(--accent)','Mezzanine':'#93c5fd'};
  const svgPie = (segs, sz=110) => {
    const total=segs.reduce((s,d)=>s+d.v,0); if(!total) return '';
    if(segs.length===1) return `<svg viewBox="0 0 ${sz} ${sz}" width="${sz}" height="${sz}"><circle cx="${sz/2}" cy="${sz/2}" r="${sz/2-3}" fill="${segs[0].color}"${segs[0].tip?` data-tip="${segs[0].tip}" style="cursor:pointer"`:''}/></svg>`;
    const cx=sz/2,cy=sz/2,r=sz/2-3; let ang=-Math.PI/2;
    return `<svg viewBox="0 0 ${sz} ${sz}" width="${sz}" height="${sz}">${segs.map(d=>{
      const sw=(d.v/total)*2*Math.PI,x1=cx+r*Math.cos(ang),y1=cy+r*Math.sin(ang);
      ang+=sw; const x2=cx+r*Math.cos(ang),y2=cy+r*Math.sin(ang),lg=sw>Math.PI?1:0;
      return `<path d="M${cx},${cy} L${x1.toFixed(1)},${y1.toFixed(1)} A${r},${r} 0 ${lg},1 ${x2.toFixed(1)},${y2.toFixed(1)} Z" fill="${d.color}"${d.tip?` data-tip="${d.tip}" style="cursor:pointer"`:''}/>`;
    }).join('')}</svg>`;
  };
  const PIE_ORDER = ['Orchestra','Mezzanine'];
  const pieSegs = Object.entries(levels).map(([l,d])=>({l,v:d.count,color:PIE_COLORS[l]||'var(--ink-3)',ratings:d.ratings})).sort((a,b)=>PIE_ORDER.indexOf(a.l)-PIE_ORDER.indexOf(b.l));
  const pieTotal = pieSegs.reduce((s,d)=>s+d.v,0)||1;
  pieSegs.forEach(d => { d.tip = `${d.l} • ${d.v} show${d.v===1?'':'s'} • ${Math.round((d.v/pieTotal)*100)}%`; });

  // ── Row 3: Time analysis ──
  const DAYS=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  const dayData = DAYS.map((lbl,i)=>({lbl,mat:0,eve:0,ratings:[]}));
  const matRatings=[], eveRatings=[];
  seen.forEach(e=>{
    if(!e.date) return;
    const dow=e.date.getDay();
    const isMat=(e.tags||[]).some(t=>t.cat==='time'&&t.label==='Matinee');
    if(isMat) { dayData[dow].mat++; if(e.rating!=null) matRatings.push(e.rating); }
    else      { dayData[dow].eve++; if(e.rating!=null) eveRatings.push(e.rating); }
    if(e.rating!=null) dayData[dow].ratings.push(e.rating);
  });
  const maxDay=Math.max(1,...dayData.map(d=>d.mat+d.eve));
  const matTotal=dayData.reduce((s,d)=>s+d.mat,0);
  const eveTotal=dayData.reduce((s,d)=>s+d.eve,0);
  const timeSegs=[
    {l:'Evening',v:eveTotal,color:'var(--accent)',ratings:eveRatings},
    {l:'Matinee',v:matTotal,color:'#93c5fd',ratings:matRatings},
  ];
  const timeTotal=matTotal+eveTotal||1;
  timeSegs[0].tip = `Evening • ${eveTotal} show${eveTotal===1?'':'s'} • ${Math.round((eveTotal/timeTotal)*100)}%`;
  timeSegs[1].tip = `Matinee • ${matTotal} show${matTotal===1?'':'s'} • ${Math.round((matTotal/timeTotal)*100)}%`;

  const MONTHS_S=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  const moData=MONTHS_S.map(lbl=>({lbl,count:0,ratings:[]}));
  seen.forEach(e=>{
    if(!e.date) return;
    moData[e.date.getMonth()].count++;
    if(e.rating!=null) moData[e.date.getMonth()].ratings.push(e.rating);
  });
  const maxMo=Math.max(1,...moData.map(d=>d.count));

  const yrMap={};
  seen.forEach(e=>{
    if(!e.date) return;
    const y=e.date.getFullYear();
    if(!yrMap[y]) yrMap[y]={count:0,ratings:[]};
    yrMap[y].count++;
    if(e.rating!=null) yrMap[y].ratings.push(e.rating);
  });
  const yrData=Object.entries(yrMap).sort((a,b)=>a[0]-b[0]).map(([y,d])=>({lbl:String(y).slice(2),full:y,count:d.count,ratings:d.ratings}));
  const maxYr=Math.max(1,...yrData.map(d=>d.count));

  // ── Row N: Genre / Venue type / Show status ──
  // Genre: Musical vs Play (exclude Concerts)
  const musD={count:0,ratings:[]}, playD={count:0,ratings:[]};
  seen.filter(e => !hasTag(e,'Concert')).forEach(e => {
    if (hasTag(e,'Play')) { playD.count++; if(e.rating!=null) playD.ratings.push(e.rating); }
    else                  { musD.count++; if(e.rating!=null) musD.ratings.push(e.rating); }
  });
  const typeSegs = [];
  if (musD.count)  typeSegs.push({l:'Musical', v:musD.count,  color:'var(--accent)', ratings:musD.ratings});
  if (playD.count) typeSegs.push({l:'Play',    v:playD.count, color:'#93c5fd',       ratings:playD.ratings});
  const typeTotal = typeSegs.reduce((s,d)=>s+d.v,0)||1;
  typeSegs.forEach(d => { d.tip = `${d.l} • ${d.v} show${d.v===1?'':'s'} • ${Math.round((d.v/typeTotal)*100)}%`; });

  // Venue type (pie)
  const VENUE_TYPE_DEFS = [
    {key:'Broadway',      label:'Broadway'},
    {key:'Off-Broadway',  label:'Off-Broadway'},
    {key:'National Tour', label:'National Tour'},
    {key:'West End',      label:'West End'},
    {key:'Israel',        label:'Israel'},
  ];
  const venueTypeData = VENUE_TYPE_DEFS.map(vt => ({...vt, count:0, ratings:[]}));
  const otherVenueD = {label:'Other', count:0, ratings:[]};
  seen.forEach(e => {
    const match = venueTypeData.find(vt => hasTag(e, vt.key));
    if (match) { match.count++; if(e.rating!=null) match.ratings.push(e.rating); }
    else       { otherVenueD.count++; if(e.rating!=null) otherVenueD.ratings.push(e.rating); }
  });
  const LOCALE_BLUES = ['#007FFF','#3395ff','#60a5fa','#7eb8fd','#93c5fd','#bfdbfe'];
  const venueSegs = [...venueTypeData, otherVenueD].filter(d => d.count > 0).map(d => ({...d, v:d.count})).sort((a,b) => b.v - a.v);
  venueSegs.forEach((d, i) => { d.color = LOCALE_BLUES[i] || '#dbeafe'; });
  const venuePieTotal = venueSegs.reduce((s,d)=>s+d.v,0)||1;
  venueSegs.forEach(d => { d.tip = `${d.label} • ${d.v} show${d.v===1?'':'s'} • ${Math.round((d.v/venuePieTotal)*100)}%`; });

  // Show status
  const regularD={count:0,ratings:[]}, previewD={count:0,ratings:[]}, closingD={count:0,ratings:[]};
  seen.forEach(e => {
    if      (hasTag(e,'Preview') || hasTag(e,'First Preview')) { previewD.count++;  if(e.rating!=null) previewD.ratings.push(e.rating); }
    else if (hasTag(e,'Closing'))                              { closingD.count++;  if(e.rating!=null) closingD.ratings.push(e.rating); }
    else                                                       { regularD.count++;  if(e.rating!=null) regularD.ratings.push(e.rating); }
  });
  const statusSegs = [];
  if (regularD.count) statusSegs.push({l:'Regular', v:regularD.count, color:'#007FFF', ratings:regularD.ratings});
  if (previewD.count) statusSegs.push({l:'Preview', v:previewD.count, color:'#60a5fa', ratings:previewD.ratings});
  if (closingD.count) statusSegs.push({l:'Closing', v:closingD.count, color:'#bfdbfe', ratings:closingD.ratings});
  const statusTotal = statusSegs.reduce((s,d)=>s+d.v,0)||1;
  statusSegs.forEach(d => { d.tip = `${d.l} • ${d.v} show${d.v===1?'':'s'} • ${Math.round((d.v/statusTotal)*100)}%`; });

  // ── Helpers ──
  const avgOf = arr => arr.filter(v=>v!=null).length?arr.filter(v=>v!=null).reduce((s,v)=>s+v,0)/arr.filter(v=>v!=null).length:null;
  const chip = avg => {
    if (avg==null) return '';
    const grade = avgLetterGrade(avg);
    return `<div style="display:flex;flex-direction:column;align-items:center;gap:2px;line-height:1">
      <span style="font-size:13px;color:var(--ink-2);font-weight:600;white-space:nowrap">${avg.toFixed(1)}★</span>
      <span class="grade-pill" data-grade="${grade}" style="font-size:10px;padding:2px 6px">${grade}</span>
    </div>`;
  };
  const inlineChip = (avg, white=false) => {
    if (avg==null) return '';
    const grade = avgLetterGrade(avg);
    const c = white ? '#fff' : 'var(--ink-2)';
    return `<span style="display:inline-flex;align-items:center;gap:4px;white-space:nowrap;line-height:1">
      <span style="font-size:13px;color:${c};font-weight:600">${avg.toFixed(1)}★</span>
      <span class="grade-pill" data-grade="${grade}" style="font-size:10px;padding:2px 6px">${grade}</span>
    </span>`;
  };
  const GRADE_COLORS = {'A+':'#1b5e20','A':'#2e7d32','A-':'#388e3c','B+':'#558b2f','B':'#689f38','B-':'#7cb342','C+':'#f9a825','C':'#f57f17','C-':'#ef6c00','D+':'#e64a19','D':'#d84315','D-':'#bf360c','F':'#b71c1c'};
  const gradeColor = g => GRADE_COLORS[g] || '#007FFF';

  // vertical bar column
  const vCol = (barH, total, {mat=0, plain=false, empty=false, label='', avg=null, tip=''}) => {
    const g = avg!=null ? `<div class="vbar-chip">${chip(avg)}</div>` : '';
    const barContent = empty
      ? `<div class="vbar-empty" style="height:${barH}px"></div>`
      : plain
        ? `<div class="vbar-seg-plain" style="height:${barH}px"${tip?` data-tip="${tip}"`:``}></div>`
        : `<div class="vbar-stack" style="height:${barH}px"${tip?` data-tip="${tip}"`:``}>
             ${mat>0?`<div class="vbar-seg-mat" style="flex:${mat}"></div>`:''}
             ${(total-mat)>0?`<div class="vbar-seg-eve" style="flex:${total-mat}"></div>`:''}
           </div>`;
    return `<div class="vbar-col">${g}${barContent}<div class="vbar-lbl">${label}</div></div>`;
  };

  const CHART_H = 110;
  const YEAR_CHART_H = 200;

  return `<div id="boards-outer" class="boards-collapsed"><div id="boards-wrap" class="hide-ratings">
    <div class="sec-hd"><h2>Favorites &amp; figures</h2><div class="rule"></div><label class="sec-hd-toggle"><input type="checkbox" id="show-ratings-cb"> show ratings</label></div>

    <div class="boards">
      <div class="board"><h3>Most-visited venues</h3>${venues.length?venues.map(([v,c],i)=>`<div class="board-item"><div class="board-rank">${String(i+1).padStart(2,"0")}</div><div class="board-name"${/[֐-׿]/.test(v)?` style="font-family:var(--ff-heb);direction:rtl"`:``}>${esc(v)}</div><div class="board-count">${c}</div></div>`).join(""):`<div style="color:var(--ink-3)">—</div>`}</div>
      <div class="board"><h3>Most-seen shows</h3>${shows.length?shows.map(([t,c],i)=>`<div class="board-item"><div class="board-rank">${String(i+1).padStart(2,"0")}</div><div class="board-name"${/[֐-׿]/.test(t)?` style="font-family:var(--ff-heb);direction:rtl"`:``}>${esc(t)}</div><div class="board-count">${c}</div></div>`).join(""):`<div style="color:var(--ink-3)">—</div>`}</div>
      <div class="board"><h3>Rating distribution</h3>
        <div class="hist">${buckets.map((b,i)=>`<div class="hist-bar"${b===0?' data-empty="true"':''} style="height:${(b/maxB)*100}%"${b>0?` data-tip="${b} show${b===1?'':'s'}"`:''} ></div>`).join("")}</div>
        <div class="hist-labels">${[['1★',['F']],['1½',['D']],['2★',['D+','C-']],['2½',['C']],['3★',['C+','B-']],['3½',['B']],['4★',['B+','A-']],['4½',['A']],['5★',['A+']]].map(([lbl,grades])=>`<span>${lbl}<div class="pills">${grades.map(g=>`<span class="grade-pill" data-grade="${g}">${g}</span>`).join('')}</div></span>`).join('')}</div>
      </div>
    </div>

    <div class="boards-genre">
      <div class="board"><h3>Genre</h3>
        <div class="pie-wrap">
          ${svgPie([...typeSegs].reverse())}
          <div class="pie-legend">
            ${typeSegs.map(d=>`<div class="pie-legend-row">
              <div class="pie-legend-left"><div class="pie-swatch" style="background:${d.color}"></div><span>${esc(d.l)}</span></div>
              <span class="chart-rating" style="display:flex;align-items:center;gap:6px;color:var(--ink-2)">${inlineChip(avgOf(d.ratings))}</span>
            </div>`).join('')}
          </div>
        </div>
      </div>
      <div class="board"><h3>Locale</h3>
        <div class="pie-wrap">
          ${svgPie([...venueSegs].reverse())}
          <div class="pie-legend">
            ${venueSegs.map(d=>`<div class="pie-legend-row">
              <div class="pie-legend-left"><div class="pie-swatch" style="background:${d.color}"></div><span>${esc(d.label||d.l)}</span></div>
              <span class="chart-rating" style="display:flex;align-items:center;gap:6px;color:var(--ink-2)">${inlineChip(avgOf(d.ratings))}</span>
            </div>`).join('')}
          </div>
        </div>
      </div>
      <div class="board"><h3>Performance type</h3>
        <div class="pie-wrap">
          ${svgPie([...statusSegs].reverse())}
          <div class="pie-legend">
            ${statusSegs.map(d=>`<div class="pie-legend-row">
              <div class="pie-legend-left"><div class="pie-swatch" style="background:${d.color}"></div><span>${esc(d.l)}</span></div>
              <span class="chart-rating" style="display:flex;align-items:center;gap:6px;color:var(--ink-2)">${inlineChip(avgOf(d.ratings))}</span>
            </div>`).join('')}
          </div>
        </div>
      </div>
    </div>
    <div class="boards-seats">
      <div class="board"><h3>Level</h3>
        <div class="pie-wrap">
          ${svgPie([...pieSegs].reverse())}
          <div class="pie-legend">
            ${pieSegs.map(d=>`<div class="pie-legend-row">
              <div class="pie-legend-left"><div class="pie-swatch" style="background:${d.color}"></div><span>${esc(d.l)}</span></div>
              <span class="chart-rating" style="display:flex;align-items:center;gap:5px;color:var(--ink-2)">${inlineChip(avgOf(d.ratings))}</span>
            </div>`).join('')}
          </div>
        </div>
      </div>
      <div class="board"><h3>Section</h3>
        ${(() => {
          const VW=699.17, VH=375.47;
          // Section widths in SVG units (used for proportional HTML label alignment)
          // Left: 197.25, gap: 16.92, Center: 270.84, gap: 16.92, Right: 197.24
          const st = Object.values(secs).reduce((s,d)=>s+d.count,0)||1;
          const sections = [
            { key:'House Left',  label:'Left',   shape:'polygon', pts:'197.25,375.47 0,375.47 0,187.74 80.3,0 197.25,0',                            fw:197.25 },
            { key:'Center',      label:'Center', shape:'rect',    x:214.17, y:0, w:270.84, h:VH,                                                    fw:270.84 },
            { key:'House Right', label:'Right',  shape:'polygon', pts:'501.93,375.47 699.17,375.47 699.17,187.74 618.87,0 501.93,0',                 fw:197.24 },
          ];
          const GAP_W = 16.92;
          const defs = sections.map((s,i) => {
            const inner = s.shape==='rect'
              ? `<rect x="${s.x}" y="${s.y}" width="${s.w}" height="${s.h}"/>`
              : `<polygon points="${s.pts}"/>`;
            return `<clipPath id="scp-${i}">${inner}</clipPath>`;
          }).join('');
          const shapes = sections.map((s,i) => {
            const d = secs[s.key];
            const pct = d.count / st;
            const fillY = (VH * (1 - pct)).toFixed(1);
            const fillH = (VH * pct + 4).toFixed(1);
            const tipStr = `${s.label} • ${d.count} show${d.count===1?'':'s'} • ${Math.round(pct*100)}%`;
            const bg = s.shape==='rect'
              ? `<rect x="${s.x}" y="${s.y}" width="${s.w}" height="${s.h}" fill="#007FFF" opacity="0.15" data-tip="${tipStr}" style="cursor:pointer"/>`
              : `<polygon points="${s.pts}" fill="#007FFF" opacity="0.15" data-tip="${tipStr}" style="cursor:pointer"/>`;
            return `${bg}
              <rect x="0" y="${fillY}" width="${VW}" height="${fillH}" fill="#007FFF" opacity="0.85" clip-path="url(#scp-${i})" data-tip="${tipStr}" style="cursor:pointer"/>`;
          }).join('');
          const svg = `<svg viewBox="0 0 ${VW} ${VH}" width="100%" style="flex:1;display:block"><defs>${defs}</defs>${shapes}</svg>`;
          // HTML labels below SVG, proportionally aligned to sections
          const labels = sections.map((s,i) => {
            const d = secs[s.key];
            const avg = avgOf(d.ratings);
            const gradeStr = avg!=null ? avgLetterGrade(avg) : '';
            const gap = i < sections.length-1 ? `<div style="flex:${GAP_W}"></div>` : '';
            return `<div style="flex:${s.fw};text-align:center;display:flex;flex-direction:column;align-items:center;gap:3px;padding-top:8px">
              <span class="chart-rating" style="display:flex;flex-direction:column;align-items:center;gap:3px">
                ${avg!=null?`<span style="font-size:13px;color:var(--ink-2);font-weight:600">${avg.toFixed(1)}★</span>`:''}
                ${gradeStr?`<span class="grade-pill" data-grade="${gradeStr}" style="font-size:10px;padding:2px 6px">${gradeStr}</span>`:''}
              </span>
            </div>${gap}`;
          }).join('');
          return `${svg}<div style="display:flex;width:100%">${labels}</div>`;
        })()}
      </div>
      <div class="board"><h3>Row</h3>
        <div class="funnel-chart">
          ${topRows.map(x=>{
            const w=Math.round((x.count/maxRow)*100);
            return `<div class="funnel-row">
              <div class="funnel-lbl">${esc(x.r)}</div>
              <div class="funnel-track"><div class="funnel-bar" style="width:${w}%" data-tip="Row ${x.r} • ${x.count} show${x.count===1?'':'s'}"></div></div>
              <div class="funnel-meta">${x.avg!=null?inlineChip(x.avg):''}</div>
            </div>`;
          }).join('')}
        </div>
      </div>
    </div>

    <div class="boards-3">
      <div class="board"><h3>Showtime</h3>
        <div class="pie-wrap">
          ${svgPie([...timeSegs].reverse())}
          <div class="pie-legend">
            ${timeSegs.map(d=>`<div class="pie-legend-row">
              <div class="pie-legend-left"><div class="pie-swatch" style="background:${d.color}"></div><span>${esc(d.l)}</span></div>
              <span class="chart-rating" style="display:flex;align-items:center;gap:6px;color:var(--ink-2)">${inlineChip(avgOf(d.ratings))}</span>
            </div>`).join('')}
          </div>
        </div>
      </div>
      <div class="board"><h3>Day of week</h3>
        <div class="vbar-wrap">
          <div class="vbar-chart">
            ${dayData.map(d=>{
              const total=d.mat+d.eve;
              const barH=total>0?Math.round((total/maxDay)*CHART_H):0;
              const avg=avgOf(d.ratings);
              const tip=total>0?`${total} show${total===1?'':'s'} · ${d.mat} mat · ${d.eve} eve`:'';
              return vCol(barH,total,{mat:d.mat,label:d.lbl,avg,tip});
            }).join('')}
          </div>
          <div class="vbar-legend">
            <span><div class="vbar-legend-dot" style="background:var(--accent)"></div>Evening</span>
            <span><div class="vbar-legend-dot" style="background:#93c5fd"></div>Matinee</span>
          </div>
        </div>
      </div>
      <div class="board chart-month"><h3>Month</h3>
        <div class="vbar-wrap">
          <div class="vbar-chart">
            ${moData.map(d=>{
              const barH=d.count>0?Math.round((d.count/maxMo)*CHART_H):0;
              const avg=avgOf(d.ratings);
              const tip=d.count>0?`${d.count} show${d.count===1?'':'s'}`:'';
              return vCol(barH,d.count,{plain:true,empty:d.count===0,label:d.lbl,avg,tip});
            }).join('')}
          </div>
        </div>
      </div>
    </div>
    <div class="board chart-year" style="margin-bottom:var(--gap)"><h3>Year</h3>
      <div class="vbar-wrap">
        <div class="vbar-chart">
          ${yrData.map(d=>{
            const barH=Math.max(2, Math.round((d.count/maxYr)*YEAR_CHART_H));
            const avg=avgOf(d.ratings);
            const tip=`${d.count} show${d.count===1?'':'s'}`;
            return vCol(barH,d.count,{plain:true,label:`<span class="yr-full">${d.full}</span><span class="yr-short">’${d.lbl}</span>`,avg,tip});
          }).join('')}
        </div>
      </div>
    </div>
    <div class="boards-show-less"><button id="boards-less-btn">Show less</button></div>
  </div>
  <div class="boards-fade-overlay"></div>
</div>
<div id="boards-more-wrap"><button id="boards-more-btn">Show more</button></div>`;
}
