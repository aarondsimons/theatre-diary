function toggleScorecard(id) {
  const isMobile = window.innerWidth <= 700;
  const ids = isMobile ? [id] : ['sc-broadway', 'sc-west-end'];
  const anyOpen = ids.some(i => document.getElementById(i)?.querySelector('.scorecard-grid')?.classList.contains('open'));
  ids.forEach(i => {
    const card = document.getElementById(i);
    if (!card) return;
    card.querySelector('.scorecard-grid').classList.toggle('open', !anyOpen);
    card.querySelector('.scorecard-toggle-btn').classList.toggle('expanded', !anyOpen);
  });
}

function openDetail(idx) {
  const e = ENTRIES[idx]; if (!e) return;
  const REVIEW_KEYS = /^(review|notes?|thoughts?|comments?|diary|description)$/i;
  const SKIP_KEYS   = /^(location|showtime|grade|seat)$/i;
  const extraReviews = Object.entries(e.extra).filter(([k]) => REVIEW_KEYS.test(k.trim()));
  const extraMeta    = Object.entries(e.extra).filter(([k]) => !REVIEW_KEYS.test(k.trim()) && !SKIP_KEYS.test(k.trim()))
    .map(([k, v]) => [/^book by$/i.test(k.trim()) && e.isPlay ? 'Written by' : k, v]);
  const locationVal  = (Object.entries(e.extra).find(([k]) => /^location$/i.test(k.trim())) || [])[1] || '';
  const showtimeVal  = (Object.entries(e.extra).find(([k]) => /^showtime$/i.test(k.trim())) || [])[1] || '';

  // Hebrew label translations
  const HE_LABELS = {
    'Book by':                   'כתיבה',
    'Music by':                  'מוזיקה',
    'Lyrics by':                 'מילים',
    'Book, Music, and Lyrics by':'מוזיקה, מילים וכתיבה',
    'Book and Lyrics by':        'כתיבה ומילים',
    'Music and Lyrics by':       'מוזיקה ומילים',
    'Written by':                'מאת',
    'Director':                  'בימוי',
    'Translated by':             'תרגום',
    'Venue':                     'תיאטרון',
    'Seen':                      'תאריך צפייה',
  };
  const lbl = s => e.isHebrew && HE_LABELS[s] ? HE_LABELS[s] : s;

  // Smart creator credit combining
  const bookKey    = e.isPlay ? 'Written by' : 'Book by';
  const musicVal   = e.composer || '';
  const lyricsVal  = (extraMeta.find(([k]) => /^lyrics by$/i.test(k)) || [])[1] || '';
  const bookVal    = (extraMeta.find(([k]) => /^(book|written) by$/i.test(k)) || [])[1] || '';
  const CREATOR_KEYS = /^(lyrics by|book by|written by)$/i;
  const filteredExtraMeta = extraMeta.filter(([k]) => !CREATOR_KEYS.test(k));
  const creditRows = [];
  if (musicVal && lyricsVal && bookVal && musicVal === lyricsVal && lyricsVal === bookVal) {
    creditRows.push([lbl('Book, Music, and Lyrics by'), musicVal]);
  } else if (musicVal && lyricsVal && musicVal === lyricsVal) {
    creditRows.push([lbl('Music and Lyrics by'), musicVal]);
    if (bookVal) creditRows.push([lbl(bookKey), bookVal]);
  } else if (lyricsVal && bookVal && lyricsVal === bookVal) {
    if (musicVal) creditRows.push([lbl('Music by'), musicVal]);
    creditRows.push([lbl('Book and Lyrics by'), lyricsVal]);
  } else {
    if (musicVal) creditRows.push([lbl('Music by'), musicVal]);
    if (lyricsVal) creditRows.push([lbl('Lyrics by'), lyricsVal]);
    if (bookVal) creditRows.push([lbl(bookKey), bookVal]);
  }

  const meta = [
    e.date && [lbl('Seen'), fmtDateDetail(e.date)],
    e.venue && [lbl('Venue'), e.venue, locationVal],
    ...creditRows,
    ...filteredExtraMeta.map(([k,v])=>[k,v]),
    e.isHebrew && e.translator && [lbl('Translated by'), e.translator],
    e.director && [lbl('Director'), e.director],
    e.company && ["Company", e.company],
    e.type && ["Category", e.type],
  ].filter(Boolean);
  const bylineLabel = e.isPlay ? 'Written by' : 'Book by';
  const pb = document.getElementById("playbill");
  pb.classList.toggle("hebrew", !!e.isHebrew);
  document.getElementById("pb-body").innerHTML = `
    ${e.coverSrc ? `<div class="pb-cover"><img src="${esc(e.coverSrc)}" alt="" referrerpolicy="no-referrer" onerror="this.parentNode.style.display='none'"></div>` : ""}
    ${e.milestone ? `<div class="pb-milestone-wrap"><span class="pb-milestone"${/[֐-׿]/.test(e.milestone)?` style="font-family:var(--ff-heb)"`:""}>${esc(e.milestone)}</span></div>` : ""}
    <h2 class="pb-title">${esc(e.title || "(untitled)")}</h2>

    <div class="pb-rating">${stars(e.rating)}${e.grade ? `<span class="grade-sep">•</span><span class="grade-pill" data-grade="${e.grade}">${e.grade}</span>` : ""}</div>
    ${(() => { const c = buildChips(e); const s = e.seat?`<span class="chip chip-seat"${/[֐-׿]/.test(e.seat)?` style="font-family:var(--ff-heb);direction:rtl"`:``}>${esc(e.seat)}</span>`:""; return (c||s)?`<div class="pb-tags">${c}${s}</div>`:""; })()}
    <div class="pb-rule"></div>
    ${meta.length ? `<dl class="pb-meta"${e.isHebrew?` style="direction:rtl"`:``}>${meta.map(([k,v,sub])=>`<div><dt${/[֐-׿]/.test(String(k))?` style="font-family:var(--ff-heb);text-align:right"`:``}>${esc(k)}</dt><dd${/[֐-׿]/.test(String(v))?` style="font-family:var(--ff-heb);direction:rtl"`:``}>${esc(v)}${sub?`<span class="pb-venue-sub">${esc(sub)}</span>`:""}</dd></div>`).join("")}</dl>` : ""}

const ORCH_ROWS = "ABCDEFGHIJKLMNOPQRSTUVWXYZ".split("");
const MEZZ_ROWS = "ABCDEFGH".split("");
const ROW_ALIASES = { "EE":"E","AX":"A","AA":"A","BB":"B","FF":"F" };
const SM = { CX: 600, FY: -500, BR: 560, ROW_SP: 19, SEAT_SP: 14.5, AISLE: 12, R: 5 };

function buildRowSeats(ri, riOffset = 0) {
  const side = Math.min(ri + riOffset + 5, 12);
  const leftMax = side * 2 - 1, rightMax = side * 2;
  const left = [], center = [], right = [];
  for (let n = leftMax; n >= 1; n -= 2) left.push(n);
  for (let n = 101; n <= 116; n++) center.push(n);
  for (let n = 2; n <= rightMax; n += 2) right.push(n);
  return { left, center, right };
}
function computeRow(rows, yShift, riOffset = 0, riStart = 0) {
  const seats = [];
  rows.forEach((letter, ri) => {
    const radius = SM.BR + (riStart + ri) * SM.ROW_SP;
    const { left, center, right } = buildRowSeats(ri, riOffset);
    const total = left.length + center.length + right.length;
    const totalW = (total - 1) * SM.SEAT_SP + 2 * SM.AISLE;
    const totalA = totalW / radius;
    const seatA = SM.SEAT_SP / radius;
    const aisleA = SM.AISLE / radius;
    let angle = Math.PI / 2 + totalA / 2;
    const place = n => {
      const x = SM.CX + radius * Math.cos(angle);
      const y = SM.FY + radius * Math.sin(angle) + yShift;
      seats.push({ row: letter, num: n, x, y, ri });
      angle -= seatA;
    };
    left.forEach(place); angle -= aisleA;
    center.forEach(place); angle -= aisleA;
    right.forEach(place);
  });
  return seats;
}

const RATING_COLORS = { 5:"#16894a", 4.5:"#52b74d", 4:"#a6d96a", 3.5:"#d4c54a", 3:"#e5a828", 2.5:"#e67c35", 2:"#d95f3d", 1.5:"#bc3a34", 1:"#8e2626" };
function ratingColor(r) { if (r == null) return "#cfcabc"; return RATING_COLORS[Math.round(r*2)/2] || "#cfcabc"; }

let SEAT_STATE = { minR: 1, maxR: 5 };

function renderSeatMap() {
  return `
    <div class="sec-hd"><h2>Where I&#8217;ve sat</h2><div class="sub">Broadway-style orchestra + mezzanine</div><div class="rule"></div></div>
    <section class="seatmap-wrap">
      <div class="sm-hd">
        <div class="sm-stats" id="sm-stats">—</div>
      </div>
      <div class="sm-svg-wrap"><div id="sm-svg"></div></div>
      <div class="sm-legend" id="sm-legend"></div>
    </section>`;
}

function initSeatMap() {
  const orch = computeRow(ORCH_ROWS, 0);
  const orchMax = Math.max(...orch.map(s => s.y));
  const mezzRaw = computeRow(MEZZ_ROWS, 0, 7, 25);
  const mezzMin = Math.min(...mezzRaw.map(s => s.y));
  const shift = (orchMax + 50) - mezzMin;
  const mezz = mezzRaw.map(s => ({ ...s, y: s.y + shift }));
  const mezzTop = Math.min(...mezz.map(s => s.y));
  const mezzMax = Math.max(...mezz.map(s => s.y));

  const lookup = {};
  orch.forEach(s => lookup[`Orchestra|${s.row}|${s.num}`] = s);
  mezz.forEach(s => lookup[`Mezzanine|${s.row}|${s.num}`] = s);

  // Build cell map — key by normalized section/row/num
  const matched = seenEntries().map(e => {
    const row = ROW_ALIASES[e.seatRow] || e.seatRow;
    let section = e.seatLocation;
    if (section === "Balcony") section = "Mezzanine";
    if (!section) {
      // Try to infer section from broadway defaults if we have a row & num but no section
      if (row && e.seatNum != null) section = "Orchestra";
    }
    const key = section && row && e.seatNum != null ? `${section}|${row}|${e.seatNum}` : null;
    const ghost = key ? lookup[key] : null;
    return { e, key, ghost };
  }).filter(x => x.ghost && x.e.rating != null && (x.e.tags||[]).some(t => t.cat === 'location' && t.label === 'Broadway'));

  const cellMap = {};
  matched.forEach(m => { (cellMap[m.key] = cellMap[m.key] || []).push(m.e); });

  const xs = [...orch, ...mezz].map(s => s.x);
  const ys = [...orch, ...mezz].map(s => s.y);
  const pad = 40;
  const vbX = Math.min(...xs) - pad;
  const vbY = Math.min(...ys) - 50;
  const vbW = Math.max(...xs) - vbX + pad;
  const vbH = Math.max(...ys) - vbY + pad;

  // Row labels (both aisles)
  const rowLabels = [];
  const byRow = {};
  [...orch, ...mezz].forEach(s => { const k = `${s.y < mezzTop ? 'O' : 'M'}-${s.row}`; (byRow[k] = byRow[k] || []).push(s); });
  Object.values(byRow).forEach(seats => {
    const leftSide  = seats.filter(s => s.num < 100 && s.num % 2 === 1).sort((a,b) => a.x - b.x);
    const rightSide = seats.filter(s => s.num < 100 && s.num % 2 === 0).sort((a,b) => a.x - b.x);
    const center    = seats.filter(s => s.num >= 101).sort((a,b) => a.x - b.x);
    const letter = seats[0].row;
    const y = center.length ? center[0].y : seats[0].y;
    if (leftSide.length && center.length)
      rowLabels.push({ letter, x: (leftSide[leftSide.length-1].x + center[0].x) / 2, y });
    if (rightSide.length && center.length)
      rowLabels.push({ letter, x: (center[center.length-1].x + rightSide[0].x) / 2, y });
  });

  const drawState = { orch, mezz, mezzTop, cellMap, vbX, vbY, vbW, vbH, rowLabels, orchMaxY: orchMax };
  redrawSeatMap(drawState);
}

function redrawSeatMap(s) {
  const { orch, mezz, mezzTop, cellMap, vbX, vbY, vbW, vbH, rowLabels, orchMaxY } = s;
  const mezzMinY = Math.min(...mezz.map(m => m.y));

  const freqColor = n => n >= 4 ? '#002266' : n === 3 ? '#004499' : n === 2 ? '#0060cc' : '#5ba8ff';

  const dots = Object.entries(cellMap).map(([key, perfs]) => {
    const n = perfs.length;
    const rep = perfs[0];
    const row = ROW_ALIASES[rep.seatRow] || rep.seatRow;
    let section = rep.seatLocation === 'Balcony' ? 'Mezzanine' : (rep.seatLocation || 'Orchestra');
    const seats = section === 'Mezzanine' ? mezz : orch;
    const p = seats.find(x => x.row === row && x.num === rep.seatNum);
    if (!p) return '';
    const color = freqColor(n);
    return `<circle class="sm-dot" data-key="${esc(key)}" cx="${p.x}" cy="${p.y}" r="${SM.R+1}" fill="${color}" stroke="#fff" stroke-width="1"></circle>${n>1?`<circle cx="${p.x+SM.R+1}" cy="${p.y-SM.R-1}" r="4.5" fill="#1a1a1a"/><text x="${p.x+SM.R+1}" y="${p.y-SM.R-0.8}" text-anchor="middle" dominant-baseline="central" fill="#fff" font-size="6" font-weight="700" pointer-events="none" font-family="var(--ff-sans)">${n}</text>`:''}`;
  }).join('');


  const totalSeated = Object.values(cellMap).reduce((n,p) => n+p.length, 0);
  const mapped = Object.keys(cellMap).length;
  document.getElementById('sm-stats').innerHTML = `<strong>${mapped}</strong> unique seats · <strong>${totalSeated}</strong> performances placed`;

  const svg = `
    <svg class="sm-svg" viewBox="${vbX} ${vbY} ${vbW} ${vbH}">
      <rect x="${SM.CX-90}" y="${vbY+6}" width="180" height="26" rx="4" fill="#3a3a3a"/>
      <text x="${SM.CX}" y="${vbY+23}" text-anchor="middle" fill="#fff" font-size="11" font-weight="600" letter-spacing="3" font-family="var(--ff-sans)">STAGE</text>
      ${orch.map(s => `<circle cx="${s.x}" cy="${s.y}" r="${SM.R}" fill="#e8e3d5"/>`).join("")}
      ${mezz.map(s => `<circle cx="${s.x}" cy="${s.y}" r="${SM.R}" fill="#e8e3d5"/>`).join("")}
      ${rowLabels.map(l => `<text class="sm-row-label" x="${l.x}" y="${l.y - 1}" text-anchor="middle" dominant-baseline="central">${l.letter}</text>`).join("")}
      <text class="sm-sec-label" x="${SM.CX}" y="${orchMaxY+30}" text-anchor="middle">ORCHESTRA</text>
      <text class="sm-sec-label" x="${SM.CX}" y="${mezzMinY+22}" text-anchor="middle">MEZZANINE</text>
      ${dots}
    </svg>`;
  document.getElementById("sm-svg").innerHTML = svg;

  // Legend
  document.getElementById('sm-legend').innerHTML = [
    ['#5ba8ff','1 visit'],['#0060cc','2 visits'],['#004499','3 visits'],['#002266','4+ visits']
  ].map(([c,l])=>`<span><span class="sw" style="background:${c}"></span>${l}</span>`).join('');

  // Tooltip
  const tt = document.getElementById("sm-tt");
  const perfCard = p => `
    <div class="sm-tt-card">
      ${p.coverSrc ? `<img class="sm-tt-thumb" src="${esc(p.coverSrc)}" alt="" referrerpolicy="no-referrer" onerror="this.remove()">` : `<div class="sm-tt-thumb-empty">♪</div>`}
      <div class="sm-tt-card-info">
        <div class="sm-tt-title">${esc(p.title||'')}</div>
        <div class="sm-tt-sub">${p.date ? fmtDateApprox(p.date) : '—'} · ${esc(p.venue||'')}</div>
        <div class="sm-tt-sub">${esc(p.seat || (p.seatRow && p.seatNum != null ? `${p.seatRow}-${p.seatNum}` : ''))}</div>
        <div class="sm-tt-rating">${stars(p.rating)}${p.grade?`<span class="grade-sep">•</span><span class="grade-pill" data-grade="${p.grade}">${p.grade}</span>`:''}</div>
      </div>
    </div>`;
  if (isTouch) {
    const svgEl = document.querySelector("#sm-svg svg");
    if (svgEl) {
      svgEl.addEventListener("touchend", ev => {
        const touch = ev.changedTouches[0];
        const tx = touch.clientX, ty = touch.clientY;
        let nearest = null, minDist = Infinity;
        document.querySelectorAll(".sm-dot").forEach(dot => {
          const r = dot.getBoundingClientRect();
          const cx = r.left + r.width / 2, cy = r.top + r.height / 2;
          const dist = Math.hypot(tx - cx, ty - cy);
          if (dist < minDist) { minDist = dist; nearest = dot; }
        });
        if (nearest) {
          const nr = nearest.getBoundingClientRect();
          const threshold = nr.width / 2 + 8;
          if (minDist < threshold) {
            nearest.classList.add("sm-dot-tapped");
            const perfs = cellMap[nearest.dataset.key];
            tt.innerHTML = perfs.map(perfCard).join('<div class="sm-tt-sep"></div>');
            const cRect = document.querySelector(".seatmap-wrap").getBoundingClientRect();
            tt.style.left = (cRect.left + 16) + "px";
            tt.style.width = (cRect.width - 32) + "px";
            tt.style.top = "auto";
            tt.style.bottom = (window.innerHeight - cRect.bottom + 16) + "px";
            tt.classList.add("open");
          }
        }
      }, { passive: true });
    }
  } else {
    document.querySelectorAll(".sm-dot").forEach(dot => {
      const key = dot.dataset.key;
      const perfs = cellMap[key];
      dot.addEventListener("mousemove", ev => {
        tt.innerHTML = perfs.map(perfCard).join('<div class="sm-tt-sep"></div>');
        tt.style.left = Math.min(window.innerWidth - 280, ev.clientX + 12) + "px";
        tt.style.top = (ev.clientY + 12) + "px";
        tt.classList.add("open");
      });
      dot.addEventListener("mouseleave", () => tt.classList.remove("open"));
    });
  }
}

function normalizeVenueName(s) {
  return s.toLowerCase().replace(/\btheater\b/g, 'theatre').replace(/['']/g, "'").trim();
}

const VENUE_ALIASES = {
  'lyric theatre': ['hilton theatre'],
};

function venueNamesForList(listName) {
  const n = normalizeVenueName(listName);
  return [n, ...(VENUE_ALIASES[n] || [])];
}

const SC_SHOW_DATA = {};

function buildScorecards() {
  const now = new Date(); now.setHours(0,0,0,0);
  const past   = seenEntries();
  const future = ENTRIES.filter(e => e.date && e.date > now);
  const nycPast    = past.filter(e   => (e.theaterCity||'').toLowerCase().includes('new york'));
  const lonPast    = past.filter(e   => (e.theaterCity||'').toLowerCase().includes('london'));
  const nycFuture  = future.filter(e => (e.theaterCity||'').toLowerCase().includes('new york'));
  const lonFuture  = future.filter(e => (e.theaterCity||'').toLowerCase().includes('london'));
  const nycPastSet = new Set(nycPast.map(e => normalizeVenueName(e.venue||'')));
  const lonPastSet = new Set(lonPast.map(e => normalizeVenueName(e.venue||'')));
  const nycFutSet  = new Set(nycFuture.map(e => normalizeVenueName(e.venue||'')));
  const lonFutSet  = new Set(lonFuture.map(e => normalizeVenueName(e.venue||'')));

  function isVisited(normSet, listName) {
    const names = venueNamesForList(listName);
    for (const v of normSet) {
      for (const l of names) {
        if (v === l || v.includes(l) || l.includes(v)) return true;
      }
    }
    return false;
  }

  function matchingEntries(allEntries, listName) {
    const names = venueNamesForList(listName);
    return allEntries.filter(e => {
      const v = normalizeVenueName(e.venue||'');
      return names.some(l => v === l || v.includes(l) || l.includes(v));
    }).sort((a, b) => (a.date||0) - (b.date||0));
  }

  function buildCard(id, title, list, pastSet, futureSet, pastEntries, futEntries) {
    const visited = list.filter(n => isVisited(pastSet, n));
    const pct = Math.round(visited.length / list.length * 100);
    const chips = list.map((n, i) => {
      const v = isVisited(pastSet, n);
      const u = !v && isVisited(futureSet, n);
      const key = `${id}-${i}`;
      if (v || u) {
        SC_SHOW_DATA[key] = [
          ...matchingEntries(pastEntries, n).map(e => ({ title: e.title||'', date: fmtDateApprox(e.date), upcoming: false })),
          ...matchingEntries(futEntries,  n).map(e => ({ title: e.title||'', date: fmtDateApprox(e.date), upcoming: true  })),
        ];
      }
      return `<span class="sc-chip${v ? ' visited' : u ? ' upcoming' : ''}"${(v||u) ? ` data-sc-key="${key}"` : ''}>${esc(n)}</span>`;
    }).join('');
    return `
      <div class="scorecard" id="${id}">
        <div class="scorecard-hd">
          <h3>${esc(title)}</h3>
          <span class="scorecard-fraction"><strong>${pct}%</strong> · ${visited.length} / ${list.length}</span>
        </div>
        <div class="scorecard-bar"><div class="scorecard-bar-fill" style="width:${pct}%"></div></div>
        <div class="scorecard-grid">${chips}</div>
        <div class="scorecard-toggle-row">
          <button class="scorecard-toggle-btn" onclick="toggleScorecard('${id}')" aria-label="Expand"><span class="sc-chevron"></span></button>
        </div>
      </div>`;
  }

  return `<div class="scorecard-pair">
    ${buildCard('sc-broadway', 'Broadway', BROADWAY_THEATRES, nycPastSet, nycFutSet, nycPast, nycFuture)}
    ${buildCard('sc-west-end', 'West End', WEST_END_THEATRES, lonPastSet, lonFutSet, lonPast, lonFuture)}
  </div>`;
}

  return `

async function initMap() {
  const mapEl = document.getElementById('venue-map');
  const statusEl = document.getElementById('map-status');
  if (!mapEl || !statusEl) return;

  // Build unique venue → entries map using theaterCity (or fall back to venue name)
  const venueEntries = new Map();
  for (const e of seenEntries()) {
    const key = (e.theaterCity || e.venue || '').trim();
    if (!key) continue;
    if (!venueEntries.has(key)) venueEntries.set(key, []);
    venueEntries.get(key).push(e);
  }

  // Geocode with localStorage cache
  const CACHE_KEY = 'map_geocache_v2';
  let cache = {};
  try { cache = JSON.parse(localStorage.getItem(CACHE_KEY) || '{}'); } catch(e) {}

  const toGeocode = [...venueEntries.keys()].filter(k => !(k in cache) && !(k in VENUE_OVERRIDES));
  if (toGeocode.length > 0) {
    for (let i = 0; i < toGeocode.length; i++) {
      const q = toGeocode[i];
      statusEl.textContent = `Locating new venue… ${i + 1} / ${toGeocode.length}`;
      try {
        const res = await fetch(
          `https://nominatim.openstreetmap.org/search?q=${encodeURIComponent(q)}&format=json&limit=1`,
          { headers: { 'User-Agent': 'AaronTheatreDiary/1.0 (personal project)' } }
        );
        const data = await res.json();
        cache[q] = data[0] ? { lat: parseFloat(data[0].lat), lng: parseFloat(data[0].lon) } : null;
      } catch(_) { cache[q] = null; }
      if (i < toGeocode.length - 1) await new Promise(r => setTimeout(r, 1100));
    }
    try { localStorage.setItem(CACHE_KEY, JSON.stringify(cache)); } catch(_) {}
  }

  statusEl.style.display = 'none';

  // Build list of located venues (manual overrides take priority over cache)
  const venues = [];
  for (const [key, entries] of venueEntries) {
    const coords = VENUE_OVERRIDES[key] || cache[key];
    if (!coords) continue;
    venues.push({ key, entries, lat: coords.lat, lng: coords.lng });
  }

  if (!venues.length) {
    statusEl.textContent = 'No venues could be located.';
    statusEl.style.display = '';
    return;
  }

  // Init Leaflet map
  const map = L.map('venue-map', { scrollWheelZoom: true, zoomControl: false });
  L.control.zoom({ position: 'bottomright' }).addTo(map);
  L.tileLayer('https://{s}.basemaps.cartocdn.com/light_nolabels/{z}/{x}/{y}{r}.png', {
    attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors &copy; <a href="https://carto.com/attributions">CARTO</a>',
    subdomains: 'abcd', maxZoom: 19
  }).addTo(map);
  L.tileLayer('https://{s}.basemaps.cartocdn.com/light_only_labels/{z}/{x}/{y}{r}.png', {
    subdomains: 'abcd', maxZoom: 19, minZoom: 5, pane: 'shadowPane'
  }).addTo(map);

  // Build pins layer
  const pinsLayer = L.layerGroup();
  const heatPoints = [];
  const maxCount = Math.max(...venues.map(v => v.entries.length));

  for (const v of venues) {
    const count = v.entries.length;
    const radius = Math.min(5 + count * 1.5, 18);
    // Interpolate fill: light #60a5fa (1 visit) → deep #1d4ed8 (max visits)
    const t = maxCount > 1 ? (count - 1) / (maxCount - 1) : 0;
    const r = Math.round(96  - t * 67);
    const g = Math.round(165 - t * 87);
    const b = Math.round(250 - t * 34);
    const marker = L.circleMarker([v.lat, v.lng], {
      radius,
      fillColor: `rgb(${r},${g},${b})`,
      color: '#fff',
      weight: 1.5,
      opacity: 1,
      fillOpacity: 0.85
    });
    // Build popup — every performance, sorted newest first
    const sorted = [...v.entries].sort((a, b) => (b.date || 0) - (a.date || 0));
    const items = sorted.map(e => {
      const dateStr = e.date ? fmtDateShort(e.date) : '';
      const isHeb = /[֐-׿]/.test(e.title || '');
      const itemStyle = isHeb ? ' style="text-align:right;direction:rtl"' : '';
      const titleStyle = isHeb ? ` style="font-family:var(--ff-heb);direction:rtl;unicode-bidi:embed"` : '';
      const dateStyle = isHeb ? ` style="direction:ltr;unicode-bidi:embed;text-align:right"` : '';
      const imgHtml = e.coverSrc ? `<img class="map-popup-item-img" src="${e.coverSrc}" alt="">` : '';
      return `<div class="map-popup-item"${itemStyle}>
        ${imgHtml}
        <div class="map-popup-item-info">
          <span class="map-popup-item-title"${titleStyle}>${esc(e.title||'(untitled)')}</span>
          ${dateStr ? `<span class="map-popup-item-date"${dateStyle}>${dateStr}</span>` : ''}
        </div>
      </div>`;
    }).join('');
    // Use the venue column value as display name; city from theaterCity key
    const venueName = (sorted[0].venue || v.key.split(',')[0]).trim();
    const venueCity = v.key.includes(',') ? v.key.slice(v.key.indexOf(',') + 1).trim() : '';
    const venueIsHeb = /[֐-׿]/.test(venueName);
    const venueNameStyle = venueIsHeb
      ? ` style="font-family:var(--ff-heb-serif);direction:rtl;unicode-bidi:embed;text-align:right"`
      : '';
    const venueCityStyle = venueIsHeb
      ? ` style="font-family:var(--ff-heb);direction:rtl;unicode-bidi:embed;text-align:right"`
      : '';
    const venueHeaderStyle = venueIsHeb ? ' style="text-align:right;direction:rtl"' : '';
    marker.bindPopup(
      `<div class="map-popup-venue"${venueHeaderStyle}>` +
      `<span class="map-popup-venue-name"${venueNameStyle}>${esc(venueName)}</span>` +
      (venueCity ? `<div class="map-popup-count"${venueCityStyle}>${esc(venueCity)}</div>` : '') +
      `<div class="map-popup-count"${venueIsHeb ? ` style="font-family:var(--ff-heb)"` : ''}>${venueIsHeb ? `${count} ${count === 1 ? 'הופעה' : 'הופעות'}` : `${count} performance${count === 1 ? '' : 's'}`}</div></div>` +
      `<div class="map-popup-list">${items}</div>`,
      { maxWidth: 320, className: venueIsHeb ? 'popup-rtl' : '' }
    );
    pinsLayer.addLayer(marker);
    for (let i = 0; i < count; i++) heatPoints.push([v.lat, v.lng, 1]);
  }

  pinsLayer.addTo(map);

  // Fit to all venues
  const bounds = L.latLngBounds(venues.map(v => [v.lat, v.lng]));
  map.fitBounds(bounds, { padding: [30, 30] });

  // Heatmap layer
  let heatLayer = null;
  if (typeof L.heatLayer === 'function') {
    heatLayer = L.heatLayer(heatPoints, {
      radius: 45,
      blur: 30,
      maxZoom: 12,
      max: 2,
      minOpacity: 0.55,
      gradient: { 0.2: '#bfdbfe', 0.45: '#60a5fa', 0.7: '#2563eb', 1.0: '#007FFF' }
    });
  }

  // Toggle buttons
  let mode = 'pins';
  const pinsBtn = document.getElementById('map-pins-btn');
  const heatBtn = document.getElementById('map-heat-btn');
  pinsBtn?.addEventListener('click', () => {
    if (mode === 'pins') return;
    mode = 'pins';
    if (heatLayer) map.removeLayer(heatLayer);
    pinsLayer.addTo(map);
    pinsBtn.classList.add('active');
    heatBtn.classList.remove('active');
  });
  heatBtn?.addEventListener('click', () => {
    if (mode === 'heat' || !heatLayer) return;
    mode = 'heat';
    map.removeLayer(pinsLayer);
    heatLayer.addTo(map);
    pinsBtn.classList.remove('active');
    heatBtn.classList.add('active');
  });

  // Reset button
  document.getElementById('map-reset-btn')?.addEventListener('click', () => {
    map.fitBounds(bounds, { padding: [30, 30] });
  });
}

load();
</script>
